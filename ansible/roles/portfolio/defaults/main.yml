---
portfolio_app_name: portfolio
portfolio_app_dir: /opt/{{ portfolio_app_name }}

# Jenkins shells out to `docker compose` from this account. Compose stats
# `.env` in the project directory before anything else, and that stat is what
# fails with "permission denied" on a root-only directory.
portfolio_deploy_group: jenkins

portfolio_image: jyok1m/portfolio:latest
portfolio_container_name: portfolio
portfolio_router: Host(`{{ portfolio_domain_com }}`) || Host(`{{ portfolio_domain_fr }}`)
