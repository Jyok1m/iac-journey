---
# Group-owned by the deploy account: Jenkins runs `docker compose` here over
# SSH, and Compose stats the project directory before it reads anything in it.
- name: Create stack directory
  ansible.builtin.file:
    path: "{{ portfolio_app_dir }}"
    state: directory
    owner: root
    group: "{{ portfolio_deploy_group }}"
    mode: "0750"

- name: Deploy compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ portfolio_app_dir }}/docker-compose.yml"
    owner: root
    group: "{{ portfolio_deploy_group }}"
    mode: "0640"

- name: Pull images
  community.docker.docker_compose_v2_pull:
    project_src: "{{ portfolio_app_dir }}"

# recreate stays on auto: Compose recreates a container whose image ID moved,
# which is exactly what a fresh :latest push produces.
- name: Deploy services
  community.docker.docker_compose_v2:
    project_src: "{{ portfolio_app_dir }}"
    state: present
    recreate: auto
    remove_orphans: true
    wait: true
    wait_timeout: 300
