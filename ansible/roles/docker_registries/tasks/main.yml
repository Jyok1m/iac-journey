---
- name: Install the Python dependency of docker_login
  ansible.builtin.apt:
    name: "{{ docker_registries_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Select the enabled registries
  ansible.builtin.set_fact:
    docker_registries_selected: "{{ docker_registries_all | selectattr('enabled') | list }}"

# Fail on the missing credential rather than on a login that reports a
# confusing 401 half a play later.
- name: Validate the credentials of the enabled registries
  ansible.builtin.assert:
    that:
      - item.username | length > 0
      - item.password | length > 0
    fail_msg: >-
      {{ item.name }} is enabled but its username or token is empty. Fill it in
      ansible/vaults/registries.yml, or disable the registry.
    quiet: true
  loop: "{{ docker_registries_selected }}"
  loop_control:
    label: "{{ item.name }}"

# Writes /root/.docker/config.json, which is what `docker push` and the Jenkins
# image push read. Credentials are stored base64-encoded, not encrypted.
#
# no_log is mandatory here: a failure would otherwise echo the module arguments
# back, token included. It also swallows which registry refused, so the login
# is allowed to fail and is reported by name below instead of aborting the loop
# on the first rejection and hiding the rest.
- name: Log in to the registries
  community.docker.docker_login:
    registry_url: "{{ item.registry_url }}"
    username: "{{ item.username }}"
    password: "{{ item.password }}"
    config_path: "{{ docker_registries_config_path }}"
  loop: "{{ docker_registries_selected }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  register: docker_registries_login
  failed_when: false

- name: Report the outcome for each registry
  ansible.builtin.debug:
    msg: >-
      {{ item.0.name }} ({{ item.0.registry_url }}) :
      {{ 'authenticated' if not item.1.failed else 'REFUSED' }}
      -> {{ docker_registries_config_path }}
  loop: "{{ docker_registries_selected | zip(docker_registries_login.results) | list }}"
  loop_control:
    label: "{{ item.0.name }}"

- name: Fail if any registry refused the credentials
  ansible.builtin.fail:
    msg: >-
      Authentication refused by:
      {{ docker_registries_selected | zip(docker_registries_login.results)
         | selectattr('1.failed') | map(attribute='0.name') | join(', ') }}.
      Check the token and its scopes in ansible/vaults/registries.yml.
  when: docker_registries_login.results | selectattr('failed') | list | length > 0
