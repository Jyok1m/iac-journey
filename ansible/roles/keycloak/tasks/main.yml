---
- name: Create stack directory
  ansible.builtin.file:
    path: "{{ keycloak_app_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Deploy env files
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ keycloak_app_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - keycloak.env
    - keycloak-db.env
  no_log: true

# copy adds and updates but does not prune: a renamed .ftl leaves its old
# version behind on the host.
- name: Deploy login themes
  ansible.builtin.copy:
    src: themes/
    dest: "{{ keycloak_themes_dir }}/"
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"
  notify: Restart keycloak

- name: Deploy compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ keycloak_app_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"

- name: Deploy services
  community.docker.docker_compose_v2:
    project_src: "{{ keycloak_app_dir }}"
    state: present
    recreate: auto
    remove_orphans: true
    wait: true
    wait_timeout: 300

# Cloudflare juge la signature TLS du client : la pile d'Ansible se fait rendre
# un 403 code 1010 la ou curl passe. Pointer le nom sur la boucle locale met
# Traefik en face, SNI et Host inchanges. Sans effet sur les conteneurs, qui
# ont leur propre resolution.
- name: Resolve the SSO hostname locally
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '\s{{ keycloak_host | regex_escape }}$'
    line: "127.0.0.1 {{ keycloak_host }}"
    owner: root
    group: root
    mode: "0644"

# Delegue au controleur : l'API d'administration est une API HTTP comme une
# autre, et le script n'a besoin que de curl et jq. run_once parce que les
# realms n'existent qu'une fois, quel que soit le nombre d'hotes.
- name: Configure the OdyssAI realms
  ansible.builtin.script:
    cmd: setup-realm.sh {{ item.0.name }}
    executable: /bin/bash
  environment:
    KC_URL: "{{ keycloak_url }}"
    KC_ADMIN_CLIENT_ID: "{{ keycloak_vault_provisioner_id }}"
    KC_ADMIN_CLIENT_SECRET: "{{ keycloak_vault_provisioner_secret }}"
    DISPLAY_NAME: "{{ item.0.display_name }}"
    API_CLIENT_ID: "{{ item.1.id }}"
    API_BASE_URL: "{{ item.1.api_url }}"
    WEB_BASE_URL: "{{ item.1.web_url }}"
    LOGIN_THEME: "{{ keycloak_odyssai_login_theme }}"
    SMTP_HOST: "{{ keycloak_odyssai_smtp_host }}"
    SMTP_PORT: "{{ keycloak_odyssai_smtp_port | string }}"
    SMTP_FROM: "{{ item.0.mailbox }}"
    SMTP_FROM_NAME: "{{ item.0.display_name }}"
    SMTP_PASSWORD: "{{ mailcow_vault_mailboxes[item.0.mailbox] }}"
  loop: "{{ keycloak_odyssai_realms | subelements('clients') }}"
  loop_control:
    label: "{{ item.0.name }} / {{ item.1.id }}"
  delegate_to: localhost
  run_once: true
  vars:
    # Une variable de connexion l'emporte sur le mot-cle `become` : c'est la
    # seule facon de ne pas demander sudo sur le poste.
    ansible_become: false
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  no_log: true
  # Le script est idempotent : rien a signaler tant qu'il sort en 0.
  changed_when: false

# Realms, clients and users only exist in this database.
- name: Schedule database dumps
  ansible.builtin.include_role:
    name: backup_postgres
  vars:
    backup_postgres_name: "{{ keycloak_app_name }}"
    backup_postgres_container: "{{ keycloak_pg_container_name }}"
    backup_postgres_network: "{{ keycloak_app_name }}_internal"
    backup_postgres_image: "{{ keycloak_pg_image }}"
    backup_postgres_user: "{{ keycloak_vault_db_user }}"
    backup_postgres_password: "{{ keycloak_vault_db_password }}"
    backup_postgres_db: "{{ keycloak_vault_db }}"
    backup_postgres_restic_repo: "{{ keycloak_backup_restic_repo }}"
    backup_postgres_restic_password: "{{ backup_mongo_vault_restic_password }}"
    backup_postgres_restic_env:
      AWS_ACCESS_KEY_ID: "{{ backup_mongo_vault_s3_access_key }}"
      AWS_SECRET_ACCESS_KEY: "{{ backup_mongo_vault_s3_secret_key }}"
    backup_postgres_on_calendar: "{{ keycloak_backup_on_calendar }}"
  tags: [keycloak, backup]
