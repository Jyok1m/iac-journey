---
- name: Create stack directory
  ansible.builtin.file:
    path: "{{ keycloak_app_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Deploy env files
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ keycloak_app_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - keycloak.env
    - keycloak-db.env
  no_log: true

# Bind-mounted into the container, so the files only have to be readable: the
# server never writes here. Note that copy adds and updates but does not prune,
# so a file removed from the theme upstream has to be cleaned by hand on the
# host — worth knowing the day a .ftl is renamed.
- name: Deploy login themes
  ansible.builtin.copy:
    src: themes/
    dest: "{{ keycloak_themes_dir }}/"
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"
  notify: Restart keycloak

- name: Deploy compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ keycloak_app_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"

- name: Deploy services
  community.docker.docker_compose_v2:
    project_src: "{{ keycloak_app_dir }}"
    state: present
    recreate: auto
    remove_orphans: true
    wait: true
    wait_timeout: 300
