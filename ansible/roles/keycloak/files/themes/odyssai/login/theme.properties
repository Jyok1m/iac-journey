# Theme de connexion OdyssAI.
#
# parent=base fournit les gabarits nus, sans le style PatternFly du theme par
# defaut. Seuls template.ftl et login.ftl sont surcharges : toutes les autres
# pages (inscription, mot de passe oublie, OTP, erreurs) heritent de base et
# reprennent la mise en forme par les classes declarees plus bas.
parent=base
import=common/keycloak

locales=fr,en

styles=css/odyssai.css

meta=viewport==width=device-width,initial-scale=1

# Enveloppes
kcHtmlClass=odyssai-html
kcBodyClass=odyssai-body
kcContentWrapperClass=odyssai-content-wrapper
kcFormCardClass=odyssai-card
kcFormHeaderClass=odyssai-form-header
kcHeaderClass=odyssai-header
kcHeaderWrapperClass=odyssai-header-wrapper
kcFormAreaClass=odyssai-form-area
kcInfoAreaClass=odyssai-info-area
kcFeedbackAreaClass=odyssai-feedback

# Formulaire
kcFormClass=odyssai-form
kcFormGroupClass=odyssai-field
kcFormGroupErrorClass=odyssai-field--error
kcLabelClass=odyssai-label
kcLabelWrapperClass=odyssai-label-wrapper
kcInputClass=odyssai-input
kcInputWrapperClass=odyssai-input-wrapper
kcInputErrorMessageClass=odyssai-error
kcInputHelperTextAfterClass=odyssai-help
kcFormOptionsClass=odyssai-options
kcFormOptionsWrapperClass=odyssai-options-wrapper
kcFormButtonsClass=odyssai-buttons
kcFormSettingClass=odyssai-setting
kcCheckboxInputClass=odyssai-checkbox
kcSelectClass=odyssai-input
kcTextareaClass=odyssai-input odyssai-textarea
kcInputHelperTextBeforeClass=odyssai-help
kcFormButtonsWrapperClass=odyssai-buttons-wrapper
kcMarginTopClass=odyssai-mt

# Champ mot de passe. base enveloppe input + bouton oeil dans kcInputGroup ; sans
# ces trois cles le bouton est rendu nu par le navigateur. passwordVisibility.js
# ecrase le className du <i>, d'ou les deux classes completes.
kcInputGroup=odyssai-input-group
kcFormPasswordVisibilityButtonClass=odyssai-pwd-toggle
kcFormPasswordVisibilityIconShow=odyssai-icon odyssai-icon--eye
kcFormPasswordVisibilityIconHide=odyssai-icon odyssai-icon--eye-off

# Cases a cocher et boutons radio generes par le user profile
kcCheckInputClass=odyssai-checkbox
kcInputClassCheckbox=odyssai-choice
kcInputClassCheckboxInput=odyssai-checkbox
kcInputClassCheckboxLabel=odyssai-choice-label
kcInputClassRadio=odyssai-choice
kcInputClassRadioInput=odyssai-radio
kcInputClassRadioLabel=odyssai-choice-label
kcInputClassRadioCheckboxLabelDisabled=odyssai-choice-label--disabled

# Boutons. Le kit distingue primaire (accent plein) et secondaire (contour).
kcButtonClass=odyssai-btn
kcButtonPrimaryClass=odyssai-btn--primary
kcButtonDefaultClass=odyssai-btn--secondary
kcButtonSecondaryClass=odyssai-btn--secondary
kcButtonLargeClass=odyssai-btn--large
kcButtonBlockClass=odyssai-btn--block

# Fournisseurs d'identite
kcFormSocialAccountClass=odyssai-social
kcFormSocialAccountListClass=odyssai-social-list
kcFormSocialAccountListGridClass=odyssai-social-list--grid
kcFormSocialAccountListButtonClass=odyssai-social-btn
kcFormSocialAccountNameClass=odyssai-social-name
kcFormSocialAccountSectionClass=odyssai-social-section
kcFormSocialAccountGridItem=odyssai-social-grid-item
kcFormSocialAccountListButtonDisabledClass=odyssai-social-btn--disabled
kcCommonLogoIdP=odyssai-social-logo

# Alertes
kcAlertClass=odyssai-alert
kcAlertTitleClass=odyssai-alert-title

# Choix du second facteur, OTP et codes de recuperation
kcSelectAuthListClass=odyssai-authlist
kcSelectAuthListItemClass=odyssai-authlist-item
kcSelectAuthListItemIconClass=odyssai-authlist-icon
kcSelectAuthListItemIconPropertyClass=odyssai-icon odyssai-icon--key
kcSelectAuthListItemBodyClass=odyssai-authlist-body
kcSelectAuthListItemHeadingClass=odyssai-authlist-title
kcSelectAuthListItemTitle=odyssai-authlist-title
kcSelectAuthListItemDescriptionClass=odyssai-authlist-desc
kcSelectAuthListItemFillClass=odyssai-authlist-fill
kcSelectAuthListItemArrowClass=odyssai-authlist-arrow
kcSelectAuthListItemArrowIconClass=odyssai-icon odyssai-icon--arrow
kcWebAuthnKeyIcon=odyssai-icon odyssai-icon--key
kcWebAuthnDefaultIcon=odyssai-icon odyssai-icon--key

kcLoginOTPListClass=odyssai-otp-option
kcLoginOTPListInputClass=odyssai-otp-radio
kcLoginOTPListItemHeaderClass=odyssai-otp-head
kcLoginOTPListItemIconBodyClass=odyssai-otp-icon
kcLoginOTPListItemIconClass=odyssai-icon odyssai-icon--key
kcLoginOTPListItemTitleClass=odyssai-otp-title

kcRecoveryCodesList=odyssai-codes
kcRecoveryCodesActions=odyssai-codes-actions
kcRecoveryCodesWarning=odyssai-codes-warning

# Selecteur de langue
kcLocaleClass=odyssai-locale
kcLocaleDropDownClass=odyssai-locale-dropdown
kcLocaleListClass=odyssai-locale-list
kcLocaleListItemClass=odyssai-locale-item
kcLocaleItemClass=odyssai-locale-link
