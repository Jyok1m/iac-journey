---
# One entry per copy of the stack, so the dev one drops out of every loop at
# once when odyssai_dev_enabled is false.

odyssai_api_env_prod:
  file: "{{ odyssai_api_env_file }}"
  api_host: "{{ odyssai_api_host }}"
  web_url: "{{ odyssai_site_url }}"
  keycloak_realm: "{{ odyssai_keycloak_realm }}"
  keycloak_client_secret: "{{ odyssai_vault_keycloak_client_secret }}"
  redis_host: "{{ odyssai_redis_container_name }}"
  redis_password: "{{ odyssai_vault_redis_password }}"
  pg_host: "{{ odyssai_pg_container_name }}"
  pg_password: "{{ odyssai_vault_pg_password }}"
  langsmith_project: Odyssai-Prod
  langsmith_tracing: "true"
  langsmith_api_key: "{{ odyssai_vault_langsmith_api_key }}"
  guide_enabled: "true"
  guide_daily_budget_usd: "1"
  guide_trace_sample_rate: "1"
  openrouter_api_key: "{{ odyssai_vault_openrouter_api_key }}"
  guide_ip_hash_secret: "{{ odyssai_vault_guide_ip_hash_secret }}"
  turnstile_secret_key: "{{ odyssai_vault_turnstile_secret_key }}"
  # The only copy allowed a live key, and the only one refused a test key.
  odyssai_env: production
  stripe_private_key: "{{ odyssai_vault_stripe_private_key | default('', true) }}"
  stripe_webhook_secret: "{{ odyssai_vault_stripe_webhook_secret | default('', true) }}"

odyssai_api_env_dev:
  file: "{{ odyssai_api_dev_env_file }}"
  api_host: "{{ odyssai_api_dev_host }}"
  web_url: "{{ odyssai_dev_site_url }}"
  keycloak_realm: "{{ odyssai_keycloak_dev_realm }}"
  keycloak_client_secret: "{{ odyssai_vault_keycloak_dev_client_secret }}"
  redis_host: "{{ odyssai_redis_dev_container_name }}"
  redis_password: "{{ odyssai_vault_redis_dev_password }}"
  pg_host: "{{ odyssai_pg_dev_container_name }}"
  pg_password: "{{ odyssai_vault_pg_dev_password }}"
  # One LangSmith key, one project per copy: the project is what separates the
  # traces. A Turnstile widget only answers for the hostnames it declares, so
  # the dev copy needs its own, and its own IP hashing secret.
  langsmith_project: Odyssai-Dev
  langsmith_tracing: "true"
  langsmith_api_key: "{{ odyssai_vault_langsmith_dev_api_key }}"
  guide_enabled: "true"
  guide_daily_budget_usd: "0.20"
  guide_trace_sample_rate: "1"
  openrouter_api_key: "{{ odyssai_vault_openrouter_dev_api_key }}"
  guide_ip_hash_secret: "{{ odyssai_vault_guide_dev_ip_hash_secret }}"
  turnstile_secret_key: "{{ odyssai_vault_turnstile_dev_secret_key }}"
  # Staging, not production: this copy runs Stripe in test mode, where a card
  # number that always succeeds is the whole point.
  odyssai_env: staging
  stripe_private_key: "{{ odyssai_vault_stripe_dev_private_key | default('', true) }}"
  stripe_webhook_secret: "{{ odyssai_vault_stripe_dev_webhook_secret | default('', true) }}"

odyssai_api_env_targets: >-
  {{ [odyssai_api_env_prod]
     + ([odyssai_api_env_dev] if odyssai_dev_enabled | bool else []) }}

odyssai_redis_conf_prod:
  file: "{{ odyssai_redis_conf_file }}"
  redis_password: "{{ odyssai_vault_redis_password }}"

odyssai_redis_conf_dev:
  file: "{{ odyssai_redis_dev_conf_file }}"
  redis_password: "{{ odyssai_vault_redis_dev_password }}"

odyssai_redis_conf_targets: >-
  {{ [odyssai_redis_conf_prod]
     + ([odyssai_redis_conf_dev] if odyssai_dev_enabled | bool else []) }}

odyssai_pg_env_prod:
  file: "{{ odyssai_pg_env_file }}"
  pg_password: "{{ odyssai_vault_pg_password }}"

odyssai_pg_env_dev:
  file: "{{ odyssai_pg_dev_env_file }}"
  pg_password: "{{ odyssai_vault_pg_dev_password }}"

odyssai_pg_env_targets: >-
  {{ [odyssai_pg_env_prod]
     + ([odyssai_pg_env_dev] if odyssai_dev_enabled | bool else []) }}
