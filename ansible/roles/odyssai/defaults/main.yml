---
odyssai_app_name: odyssai
odyssai_app_dir: /opt/{{ odyssai_app_name }}

odyssai_deploy_group: jenkins

# Second copy of the whole stack on :dev images. False stops rendering it.
odyssai_dev_enabled: true

# The Jenkinsfile tags on the branch name: `main` is production, `dev` the
# staging copy. No :latest to promote: the front bakes a different SITE_URL.
odyssai_image_ns: jyok1m

odyssai_api_image: "{{ odyssai_image_ns }}/odyssai-api:main"
odyssai_api_container_name: odyssai-api
# Pinned in the image; repeated because the healthcheck and the Traefik service
# port both have to agree with it.
odyssai_api_port: 3001
# Heap under the cgroup limit so V8 aborts with a JS stack trace instead of
# being SIGKILLed.
odyssai_api_memory: 512M
odyssai_api_heap_mb: 384
odyssai_api_dev_image: "{{ odyssai_image_ns }}/odyssai-api:dev"
odyssai_api_dev_container_name: odyssai-api-dev

# Generation worker. No port, no router: it consumes the queue and serves
# nothing. It shares the API's env file rather than carrying a second copy of
# the same Postgres, Redis, LangSmith and provider values.
odyssai_worker_image: "{{ odyssai_image_ns }}/odyssai-worker:main"
odyssai_worker_container_name: odyssai-worker
odyssai_worker_memory: 512M
odyssai_worker_heap_mb: 384
odyssai_worker_dev_image: "{{ odyssai_image_ns }}/odyssai-worker:dev"
odyssai_worker_dev_container_name: odyssai-worker-dev

# The only thing that applies the schema: the API image ships without the
# Prisma CLI. Same tag as the copy it migrates, so a build and its schema
# travel together.
odyssai_migrate_image: "{{ odyssai_image_ns }}/odyssai-migrate:main"
odyssai_migrate_dev_image: "{{ odyssai_image_ns }}/odyssai-migrate:dev"
odyssai_migrate_memory: 512M

odyssai_web_image: "{{ odyssai_image_ns }}/odyssai-web:main"
odyssai_web_container_name: odyssai-web
odyssai_web_port: 3000
odyssai_web_memory: 512M
odyssai_web_heap_mb: 384
odyssai_web_dev_image: "{{ odyssai_image_ns }}/odyssai-web:dev"
odyssai_web_dev_container_name: odyssai-web-dev

# The apex and *.odyssai.app are the two records terraform publishes, both
# proxied by Cloudflare and both pointing here.
odyssai_domain: odyssai.app
odyssai_web_host: "{{ odyssai_domain }}"
odyssai_web_router: Host(`{{ odyssai_web_host }}`)
odyssai_web_alias_router: Host(`www.{{ odyssai_web_host }}`)
odyssai_web_dev_host: dev.{{ odyssai_domain }}
odyssai_web_dev_router: Host(`{{ odyssai_web_dev_host }}`)
# The staging copy answers 401 to everyone, crawlers included: it serves the
# same pages as production with its own canonical URLs and sitemap, which would
# otherwise compete with it. The file is mounted by the traefik role and its
# key lives in vaults/traefik.yml.
odyssai_dev_basic_auth: true
odyssai_dev_basic_auth_file: /etc/traefik/odyssai-dev.htpasswd
odyssai_dev_basic_auth_realm: OdyssAI staging

# False keeps the API reachable from the front over the internal network alone.
odyssai_api_public: true
odyssai_api_host: api.{{ odyssai_domain }}
odyssai_api_router: Host(`{{ odyssai_api_host }}`)
# api-dev and not api.dev: a DNS wildcard matches a single label, so
# *.odyssai.app would not cover api.dev.odyssai.app, nor would Cloudflare's
# edge certificate.
odyssai_api_dev_host: api-dev.{{ odyssai_domain }}
odyssai_api_dev_router: Host(`{{ odyssai_api_dev_host }}`)

# Session store, one instance per copy: the dev copy must not be able to read
# or evict production sessions.
odyssai_redis_image: redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
odyssai_redis_container_name: odyssai-redis
odyssai_redis_dev_container_name: odyssai-redis-dev
odyssai_redis_port: 6379
odyssai_redis_port_dev: 16379
odyssai_redis_memory: 256M
odyssai_redis_maxmemory: 192mb
odyssai_redis_conf_file: redis.conf
odyssai_redis_dev_conf_file: redis-dev.conf

# Same split for the database. Published on the host loopback so psql,
# migrations and dumps can run from a workstation over an SSH tunnel.
# pgvector/pgvector rather than the official postgres image: the game master's
# long memory recalls old turns by similarity, which needs the `vector`
# extension, and the official image does not ship it. Same Postgres 18
# underneath, so the data directory is unchanged and the swap is a restart.
#
# Until this is deployed, the API detects the missing extension at boot and
# falls back to the last few turns. The game is playable, the memory is short.
odyssai_pg_image: pgvector/pgvector:pg18-trixie@sha256:78bf48b801e792f99e3ac62b5036fd3876e9be48afda16c1e331af1c75ceb2ff
odyssai_pg_container_name: odyssai-db
odyssai_pg_dev_container_name: odyssai-db-dev
odyssai_pg_port: 5432
odyssai_pg_port_host: 5432
odyssai_pg_port_host_dev: 15432
odyssai_pg_memory: 512M
odyssai_pg_shared_buffers: 128MB
odyssai_pg_effective_cache_size: 384MB
odyssai_pg_max_connections: 50
# Identical on both copies: each instance is a server of its own, so only the
# passwords differ. Those live in vaults/odyssai.yml.
odyssai_pg_db: odyssai
odyssai_pg_user: odyssai
odyssai_pg_env_file: odyssai-db.env
odyssai_pg_dev_env_file: odyssai-db-dev.env

# One realm per environment on the SSO host. The API is the only client and it
# is confidential; the secret lives in vaults/odyssai.yml.
odyssai_keycloak_url: https://sso.{{ portfolio_domain_com }}
odyssai_keycloak_realm: odyssai-prod
odyssai_keycloak_dev_realm: odyssai-dev
odyssai_keycloak_client_id: odyssai-api

# One mailbox per environment: a message from the dev copy must never pass for
# production, and rotating one password must not silence the other.
# The public name, not the container: it is the one the mailcow certificate is
# issued for, which STARTTLS verifies. 587 is submission (STARTTLS); 465 would
# be implicit TLS and the two never combine.
# Passwords live in vaults/mailcow.yml; the from address is the SMTP username.
odyssai_smtp_host: mail.{{ portfolio_domain_com }}
odyssai_smtp_port: 587
odyssai_smtp_from: no-reply@{{ odyssai_domain }}
odyssai_smtp_dev_from: no-reply-dev@{{ odyssai_domain }}
odyssai_smtp_from_display_name: "Joachim @ OdyssAI"
# Where the contact form's messages land. One inbox for both copies: a message
# sent from the dev site is still a message to read.
odyssai_contact_to: joachim.jasmin-dev@proton.me

odyssai_api_env_file: odyssai-api.env
odyssai_api_dev_env_file: odyssai-api-dev.env

# Baked into the image by the pipeline for the prerendered locales, and read at
# runtime by src/lib/seo.ts for everything else, so it has to match the build.
odyssai_site_url: https://{{ odyssai_web_host }}
odyssai_dev_site_url: https://{{ odyssai_web_dev_host }}

# Site guide. What differs per copy (LangSmith project, budget, secrets) lives
# in vars/main.yml.
odyssai_guide_provider: openrouter
odyssai_guide_model: openai/gpt-5.6-luna
# data_collection deny drops the providers that retain exchanges; reasoning
# none keeps a 120 word answer from being billed thinking tokens.
odyssai_guide_extra_body: '{"models":["qwen/qwen3.8-flash"],"reasoning":{"effort":"none"},"provider":{"data_collection":"deny"}}'
odyssai_guide_temperature: "0.3"
odyssai_guide_max_output_tokens: 350
# Priced on the fallback, the dearer of the chain: a budget that is wrong has
# to be wrong on the high side.
odyssai_guide_price_input: "0.20"
odyssai_guide_price_output: "1.20"

odyssai_guide_rate_per_hour: 10
odyssai_guide_rate_per_day: 30
odyssai_guide_max_concurrent: 5
odyssai_guide_pass_questions: 10
odyssai_guide_pass_ttl_seconds: 3600
odyssai_guide_log_retention_days: 30

# Cloudflare then Traefik each append to X-Forwarded-For. Without both hops,
# req.ip is Traefik's and the per-IP window becomes one global window.
odyssai_trust_proxy: 2

# World narrator and generation. The model was picked by evaluation, not by
# reputation: `pnpm --filter @odyssai/api eval:narration` scores candidates on
# the abstraction pass, and this is the winner. Re-run it before changing this
# line. LLM_NARRATOR_CANDIDATES is deliberately absent: the comparison is a
# workstation task, and a server has nothing to compare.
odyssai_narrator_provider: openrouter
odyssai_narrator_model: qwen/qwen3.5-35b-a3b
# Same reasoning as the guide: data_collection deny drops providers that retain
# exchanges, reasoning none keeps structured JSON from being billed thinking.
odyssai_narrator_extra_body: '{"reasoning":{"effort":"none"},"provider":{"data_collection":"deny"}}'
# Higher than the guide's 0.3: this writes worlds, not answers about a website.
odyssai_narrator_temperature: "0.6"
odyssai_narrator_max_output_tokens: 900
# Order of magnitude, derived from what the evaluation reported for this model,
# not from a price list. Nothing reads them yet: the worker enforces no budget.
# Check them against OpenRouter the day a budget is wired to generation, since
# a budget priced wrong is worse than none.
odyssai_narrator_price_input: "0.10"
odyssai_narrator_price_output: "0.40"

# One world at a time. A generation is seven model calls over several minutes,
# and running two abreast on this host lengthens both for nothing.
odyssai_worker_concurrency: 1

odyssai_langsmith_endpoint: https://eu.api.smith.langchain.com
# Traces keep metadata, usage and timings but not the text: questions and
# answers already sit in guide_questions for the retention above.
odyssai_guide_trace_hide_io: "true"

# Stripe keys live in the vault: odyssai_vault_stripe_private_key,
# odyssai_vault_stripe_webhook_secret and their _dev_ counterparts.
#
# Price ids are deliberately absent. Plans are rows in the `plans` table, and
# the admin dashboard at /admin creates the Stripe product and price itself
# when you add a paid tier. Nothing to set here, nothing to redeploy.
