---
# Default Role
odyssai_app_name: odyssai
odyssai_app_dir: /opt/{{ odyssai_app_name }}

odyssai_deploy_group: jenkins

# Second copy of the whole stack — API and front — on :dev images. The pipeline
# builds and publishes the `dev` branch too, so the images always exist.
# Set to false to stop rendering and deploying it.
odyssai_dev_enabled: true

# Images — the Jenkinsfile tags on the branch name, so `main` is production and
# `dev` is the staging copy. There is no :latest to promote: the two tags are
# built from different sources and, for the front, with a different SITE_URL
# baked in.
odyssai_image_ns: jyok1m

# Service API (NestJS)
odyssai_api_image: "{{ odyssai_image_ns }}/odyssai-api:main"
odyssai_api_container_name: odyssai-api
# PORT is pinned in the image; repeated here because the compose healthcheck
# and the Traefik service port both have to agree with it.
odyssai_api_port: 3001
# Heap capped below the cgroup limit so V8 aborts with a JS stack trace instead
# of being SIGKILLed by the kernel.
odyssai_api_memory: 512M
odyssai_api_heap_mb: 384
odyssai_api_dev_image: "{{ odyssai_image_ns }}/odyssai-api:dev"
odyssai_api_dev_container_name: odyssai-api-dev

# Service Web (Next.js, output standalone)
odyssai_web_image: "{{ odyssai_image_ns }}/odyssai-web:main"
odyssai_web_container_name: odyssai-web
odyssai_web_port: 3000
# A standalone Next server idles around 100 MB; the ceiling is there for the
# SSR bursts, and the heap stays under it for the same reason as the API.
odyssai_web_memory: 512M
odyssai_web_heap_mb: 384
odyssai_web_dev_image: "{{ odyssai_image_ns }}/odyssai-web:dev"
odyssai_web_dev_container_name: odyssai-web-dev

# Routing — front
# The apex and *.odyssai.app are the two records terraform publishes for this
# zone, both proxied by Cloudflare and both pointing at this host.
odyssai_domain: odyssai.app
odyssai_web_host: "{{ odyssai_domain }}"
odyssai_web_router: Host(`{{ odyssai_web_host }}`)
odyssai_web_alias_router: Host(`www.{{ odyssai_web_host }}`)
odyssai_web_dev_host: dev.{{ odyssai_domain }}
odyssai_web_dev_router: Host(`{{ odyssai_web_dev_host }}`)

# Routing — API
# Public on a host of its own. Nothing in apps/web calls it yet, so this only
# buys a curlable endpoint today; flip to false to keep the API reachable from
# the front over the internal network alone.
odyssai_api_public: true
odyssai_api_host: api.{{ odyssai_domain }}
odyssai_api_router: Host(`{{ odyssai_api_host }}`)
# Deliberately api-dev, not api.dev: a DNS wildcard matches a single label, so
# *.odyssai.app covers api-dev.odyssai.app but not api.dev.odyssai.app — which
# would resolve nowhere, and would not be covered by Cloudflare's edge
# certificate either.
odyssai_api_dev_host: api-dev.{{ odyssai_domain }}
odyssai_api_dev_router: Host(`{{ odyssai_api_dev_host }}`)

# Redis — session store for the API. One instance per copy of the stack: the
# dev copy must not be able to read, or evict, production sessions.
# Pinned by digest like the other third-party images in this inventory.
odyssai_redis_image: redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
odyssai_redis_container_name: odyssai-redis
odyssai_redis_dev_container_name: odyssai-redis-dev
odyssai_redis_port: 6379
odyssai_redis_port_dev: 16379
# Sessions are small and all carry a TTL. The ceiling is there so a leak cannot
# starve the host, and volatile-ttl evicts what expires soonest rather than
# refusing writes.
odyssai_redis_memory: 256M
odyssai_redis_maxmemory: 192mb
odyssai_redis_conf_file: redis.conf
odyssai_redis_dev_conf_file: redis-dev.conf

# PostgreSQL — one instance per copy of the stack, same reasoning as Redis: the
# dev copy must never be able to read, or drop, production data.
# Pinned by digest like the other third-party images in this inventory.
odyssai_pg_image: postgres:18.4-trixie@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
odyssai_pg_container_name: odyssai-db
odyssai_pg_dev_container_name: odyssai-db-dev
odyssai_pg_port: 5432
# Published on the host loopback: schema work, dumps and one-off queries happen
# from a laptop over an SSH tunnel, there is no admin UI behind Traefik to do it
# through. Two host ports for two servers — production keeps the well-known
# number, the dev copy is prefixed the way the Redis pair already is.
odyssai_pg_port_host: 5432
odyssai_pg_port_host_dev: 15432
# One set of values for both copies, like the API and the front above: a dev
# instance tuned differently would stop telling you anything about production.
odyssai_pg_memory: 512M
odyssai_pg_shared_buffers: 128MB
odyssai_pg_effective_cache_size: 384MB
odyssai_pg_max_connections: 50
# Database and role names are not secrets, and they are identical on both
# copies — each instance is a server of its own, so only the passwords have to
# differ. Those live in vaults/odyssai.yml.
odyssai_pg_db: odyssai
odyssai_pg_user: odyssai
odyssai_pg_env_file: odyssai-db.env
odyssai_pg_dev_env_file: odyssai-db-dev.env

# Keycloak — one realm per environment, both on the SSO host installed by the
# keycloak role. The API is the only client and it is confidential; the secret
# lives in vaults/odyssai.yml.
odyssai_keycloak_url: https://sso.{{ portfolio_domain_com }}
odyssai_keycloak_realm: odyssai-prod
odyssai_keycloak_dev_realm: odyssai-dev
odyssai_keycloak_client_id: odyssai-api

# Email delivery for the realms. One mailbox per environment: a message sent
# by the dev copy must never be able to pass for production, and rotating one
# password must not silence the other.
#
# The host is the public name and not the container: it is the one the mailcow
# certificate is issued for, which STARTTLS verifies. 587 is the submission
# port, encrypted by STARTTLS after an initial plaintext connect; 465 would be
# implicit TLS instead, and the two never combine.
#
# The mailbox passwords live in vaults/mailcow.yml, keyed by full address, and
# the from address doubles as the SMTP username — these mailboxes authenticate
# as themselves.
odyssai_smtp_host: mail.{{ portfolio_domain_com }}
odyssai_smtp_port: 587
odyssai_smtp_from: no-reply@{{ odyssai_domain }}
odyssai_smtp_dev_from: no-reply-dev@{{ odyssai_domain }}
odyssai_smtp_from_display_name: "Joachim @ OdyssAI"

# Env files. Everything the API reads that is either a secret or an origin it
# cannot guess. NODE_ENV, PORT and the heap ceiling stay in the compose file:
# they describe the container, not the application.
odyssai_api_env_file: odyssai-api.env
odyssai_api_dev_env_file: odyssai-api-dev.env

# Canonical origin of the front — canonical tags, hreflang, OpenGraph, sitemap
# and robots. The pipeline already bakes it into the image (the locale routes
# are prerendered), but src/lib/seo.ts reads it at runtime for everything that
# is not, so it has to be set here too and has to match what the build used.
odyssai_site_url: https://{{ odyssai_web_host }}
odyssai_dev_site_url: https://{{ odyssai_web_dev_host }}
