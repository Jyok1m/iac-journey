---
# Ordered after the deploy: the API is recreated by Compose with the new
# REDIS_URL first, then the server it talks to picks up the matching password.
- name: Restart odyssai redis
  community.docker.docker_compose_v2:
    project_src: "{{ odyssai_app_dir }}"
    services: >-
      {{ ['redis'] + (['redis-dev'] if odyssai_dev_enabled | bool else []) }}
    state: restarted
