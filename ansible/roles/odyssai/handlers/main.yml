---
# Runs after the deploy: the API gets the new REDIS_URL first, then the server
# picks up the matching password.
- name: Restart odyssai redis
  community.docker.docker_compose_v2:
    project_src: "{{ odyssai_app_dir }}"
    services: >-
      {{ ['redis'] + (['redis-dev'] if odyssai_dev_enabled | bool else []) }}
    state: restarted
