---
- name: Create stack directory
  ansible.builtin.file:
    path: "{{ odyssai_app_dir }}"
    state: directory
    owner: root
    group: "{{ odyssai_deploy_group }}"
    mode: "0750"

# No handler: env_file is part of the service config hash, so `recreate: auto`
# already bounces the container when a value here moves.
- name: Deploy env files
  ansible.builtin.template:
    src: odyssai-api.env.j2
    dest: "{{ odyssai_app_dir }}/{{ item.file }}"
    owner: root
    group: "{{ odyssai_deploy_group }}"
    mode: "0640"
  loop: "{{ odyssai_api_env_targets }}"
  vars:
    api_host: "{{ item.api_host }}"
    web_url: "{{ item.web_url }}"
    keycloak_realm: "{{ item.keycloak_realm }}"
    keycloak_client_secret: "{{ item.keycloak_client_secret }}"
    redis_host: "{{ item.redis_host }}"
    redis_password: "{{ item.redis_password }}"
    pg_host: "{{ item.pg_host }}"
    pg_password: "{{ item.pg_password }}"
  no_log: true

- name: Deploy database env files
  ansible.builtin.template:
    src: odyssai-db.env.j2
    dest: "{{ odyssai_app_dir }}/{{ item.file }}"
    owner: root
    group: "{{ odyssai_deploy_group }}"
    mode: "0640"
  loop: "{{ odyssai_pg_env_targets }}"
  vars:
    pg_password: "{{ item.pg_password }}"
  no_log: true

# This one does need a handler: a bind mount is opaque to Compose, so the
# server would keep serving the old password until something restarts it.
- name: Deploy redis config
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ odyssai_app_dir }}/{{ item.file }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ odyssai_redis_conf_targets }}"
  vars:
    redis_password: "{{ item.redis_password }}"
  no_log: true
  notify: Restart odyssai redis

- name: Deploy compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ odyssai_app_dir }}/docker-compose.yml"
    owner: root
    group: "{{ odyssai_deploy_group }}"
    mode: "0640"

- name: Pull images
  community.docker.docker_compose_v2_pull:
    project_src: "{{ odyssai_app_dir }}"

# auto recreates a container whose image ID moved, so a fresh push on :dev
# bounces the dev copy and leaves production alone.
- name: Deploy services
  community.docker.docker_compose_v2:
    project_src: "{{ odyssai_app_dir }}"
    state: present
    recreate: auto
    remove_orphans: true
    wait: true
    wait_timeout: 300
