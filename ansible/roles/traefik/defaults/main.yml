---
traefik_app_name: traefik
traefik_app_dir: /opt/{{ traefik_app_name }}
# Outside the stack directory: certificates must survive a `compose down -v`.
traefik_data_dir: /var/lib/{{ traefik_app_name }}

traefik_image: traefik:v3.6@sha256:31267173a15b4944e797a76ffd9c419707c8d8b32fe5b610f80cd0cfa05f372d
traefik_container_name: traefik
traefik_acme_email: joachim.jasmin-dev@proton.me
# Scraped by Prometheus over traefik-public.
traefik_metrics_port: 8082

# This role owns the network; every other stack declares it external and has to
# be deployed after traefik.
traefik_public_network: traefik-public

# Names that resolve straight to traefik from inside traefik-public, instead of
# leaving the host for the Cloudflare edge and coming back, which also earns a
# 403 code 1010 when its bot protection judges the TLS signature of a hosting
# IP. SNI and Host stay the public name, so the certificate still matches.
# Only containers attached to traefik-public see these.
traefik_internal_aliases:
  - sso.{{ portfolio_domain_com }}

# htpasswd files other stacks point at with basicauth.usersfile. Traefik is
# what reads them, so they are mounted here rather than in the stack that uses
# them, and the hash never reaches a label where docker inspect would show it.
# An entry with an empty value is skipped, so the role deploys before its vault
# key exists.
traefik_htpasswd_files:
  odyssai-dev: "{{ traefik_vault_odyssai_dev_basic_auth | default('') }}"
  shobukapp-dev: "{{ traefik_vault_shobukapp_dev_basic_auth | default('') }}"
