---
# Group-owned by the deploy account: Jenkins runs `docker compose` here over
# SSH, and Compose stats the project directory before it reads anything in it.
- name: Create stack directory
  ansible.builtin.file:
    path: "{{ ipseis_app_dir }}"
    state: directory
    owner: root
    group: "{{ ipseis_deploy_group }}"
    mode: "0750"

# Docker would create these itself, but only as root-owned directories at
# container start, which hides the ownership decision.
- name: Create upload directories
  ansible.builtin.file:
    path: "{{ ipseis_app_dir }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop: >-
    {{ ['uploads'] + (['uploads-dev'] if ipseis_dev_enabled else []) }}

- name: Deploy env files
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ ipseis_app_dir }}/{{ item }}"
    owner: root
    group: "{{ ipseis_deploy_group }}"
    mode: "0640"
  loop: >-
    {{ [ipseis_db_env_file, ipseis_api_env_file]
       + ([ipseis_db_dev_env_file, ipseis_api_dev_env_file] if ipseis_dev_enabled else []) }}
  no_log: true

- name: Deploy compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ ipseis_app_dir }}/docker-compose.yml"
    owner: root
    group: "{{ ipseis_deploy_group }}"
    mode: "0640"

- name: Pull images
  community.docker.docker_compose_v2_pull:
    project_src: "{{ ipseis_app_dir }}"

# auto recreates a container whose image ID moved, so a new :latest push
# bounces the API without restarting the database.
- name: Deploy services
  community.docker.docker_compose_v2:
    project_src: "{{ ipseis_app_dir }}"
    state: present
    recreate: auto
    remove_orphans: true
    wait: true
    wait_timeout: 300

- name: Schedule database dumps
  ansible.builtin.include_role:
    name: backup_mongo
  vars:
    backup_mongo_name: "{{ ipseis_app_name }}"
    backup_mongo_container: "{{ ipseis_db_container_name }}"
    backup_mongo_network: "{{ ipseis_app_name }}-internal"
    backup_mongo_image: "{{ ipseis_db_image }}"
    backup_mongo_username: "{{ ipseis_vault_db_root_user }}"
    backup_mongo_password: "{{ ipseis_vault_db_root_password }}"
    backup_mongo_restic_repo: "{{ ipseis_backup_restic_repo }}"
    backup_mongo_restic_password: "{{ backup_mongo_vault_restic_password }}"
    backup_mongo_restic_env:
      AWS_ACCESS_KEY_ID: "{{ backup_mongo_vault_s3_access_key }}"
      AWS_SECRET_ACCESS_KEY: "{{ backup_mongo_vault_s3_secret_key }}"
    backup_mongo_on_calendar: "{{ ipseis_backup_on_calendar }}"

# mongo-dump-ipseis predates backup_mongo and was never in this repository:
# a hand-made timer on the same 03:00 slot, with its own script and env file.
# Kept running, it dumps the same database twice a night.
- name: Look for the legacy dump timer
  ansible.builtin.stat:
    path: /etc/systemd/system/mongo-dump-ipseis.timer
  register: ipseis_legacy_dump_timer
  tags: [ipseis, backup]

- name: Stop and disable the legacy dump timer
  ansible.builtin.systemd_service:
    name: mongo-dump-ipseis.timer
    state: stopped
    enabled: false
  when: ipseis_legacy_dump_timer.stat.exists
  tags: [ipseis, backup]

# The local dumps it left behind are not touched.
- name: Remove the legacy dump units, script and env file
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/mongo-dump-ipseis.timer
    - /etc/systemd/system/mongo-dump-ipseis.service
    - /usr/local/bin/mongo-dump-ipseis.sh
    - /etc/mongo-dump-ipseis.env
  register: ipseis_legacy_dump_removed
  tags: [ipseis, backup]

- name: Reload systemd after removing the legacy units
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: ipseis_legacy_dump_removed is changed
  tags: [ipseis, backup]
