---
# Handlers run in the order they are DEFINED here, not the order they are
# notified. Only one ordering constraint actually matters: systemd is reloaded
# before anything tries to start a unit.
#
# Note that a change touching both mailcow.conf and extra.cf bounces Postfix
# twice — once inside the recreate, once on its own. No ordering of these two
# avoids that, so it is accepted rather than explained away.

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Recreate mailcow
  community.docker.docker_compose_v2:
    project_src: "{{ mailcow_app_dir }}"
    state: present
    recreate: auto
    remove_orphans: false
    wait: true
    wait_timeout: 600

- name: Restart postfix
  community.docker.docker_compose_v2:
    project_src: "{{ mailcow_app_dir }}"
    services:
      - postfix-mailcow
    state: restarted
    wait: true
    wait_timeout: 180

# SOGo enumerates the mail domains from the database ONCE, in
# bootstrap-sogo.sh at container start, and writes one SOGoUserSources block
# per domain into /etc/sogo/sogo.conf. A domain created after that start is
# invisible to it until it is restarted — every mailbox in that domain
# authenticates fine against mailcow and then gets "Unauthorized" from the
# webmail, while IMAP and SMTP keep working because Dovecot and Postfix read
# the database live. Nothing in the stack restarts SOGo on its own.
- name: Restart sogo
  community.docker.docker_compose_v2:
    project_src: "{{ mailcow_app_dir }}"
    services:
      - sogo-mailcow
    state: restarted
    wait: true
    wait_timeout: 180

- name: Restart dovecot
  community.docker.docker_compose_v2:
    project_src: "{{ mailcow_app_dir }}"
    services:
      - dovecot-mailcow
    state: restarted
    wait: true
    wait_timeout: 180

# There is deliberately no certificate-sync handler. certs.yml runs the sync
# as an ordinary task, after the stack is up, because the sync depends on
# Traefik already holding a certificate — which cannot be true at the point a
# config change would fire a handler.
