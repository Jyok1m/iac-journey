---
# Handlers run in definition order, not notification order. The one constraint
# that matters: systemd is reloaded before anything starts a unit.
# A change to both mailcow.conf and extra.cf bounces Postfix twice; no ordering
# avoids that.

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Recreate mailcow
  community.docker.docker_compose_v2:
    project_src: "{{ mailcow_app_dir }}"
    state: present
    recreate: auto
    remove_orphans: false
    wait: true
    wait_timeout: 600

- name: Restart postfix
  community.docker.docker_compose_v2:
    project_src: "{{ mailcow_app_dir }}"
    services:
      - postfix-mailcow
    state: restarted
    wait: true
    wait_timeout: 180

# SOGo enumerates the domains once at container start. A domain created after
# that gets "Unauthorized" from the webmail while IMAP and SMTP keep working,
# and nothing in the stack restarts SOGo on its own.
- name: Restart sogo
  community.docker.docker_compose_v2:
    project_src: "{{ mailcow_app_dir }}"
    services:
      - sogo-mailcow
    state: restarted
    wait: true
    wait_timeout: 180

- name: Restart dovecot
  community.docker.docker_compose_v2:
    project_src: "{{ mailcow_app_dir }}"
    services:
      - dovecot-mailcow
    state: restarted
    wait: true
    wait_timeout: 180

# No certificate-sync handler on purpose: the sync needs Traefik to already
# hold a certificate, so certs.yml runs it as a task once the stack is up.
