---
# generate_config.sh is never run: interactive, overwrites mailcow.conf rather
# than merging, and its IPv6 step offers to restart the Docker daemon. Pinned
# checkout, config owned by this role. Deviation CONF-1.

# A runtime dependency, not a build one: certs.yml and the sync script read
# Traefik's ACME store with it, so a host without jq loses renewal silently.
- name: Install the packages the role shells out to
  ansible.builtin.apt:
    name:
      - jq
      - git
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the stack directory
  ansible.builtin.file:
    path: "{{ mailcow_app_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

# The tree is never clean once the stack has run — postfix.sh rewrites main.cf
# on every container start. Gating on the tag keeps the checkout out of steady
# state. Raw command because ansible.builtin.git has no read-only mode.
- name: Read the checked-out mailcow version # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: git -C {{ mailcow_app_dir }} describe --tags --exact-match
  register: mailcow_current_version
  changed_when: false
  failed_when: false

- name: Check out mailcow-dockerized at the pinned tag
  ansible.builtin.git:
    repo: "{{ mailcow_repo }}"
    dest: "{{ mailcow_app_dir }}"
    version: "{{ mailcow_version }}"
    depth: 1
    # Only on a real version change, where discarding the runtime rewrite of
    # main.cf is the point: the new tag ships its own.
    force: true
  register: mailcow_checkout
  when: mailcow_current_version.stdout | trim != mailcow_version

# docker compose reads .env for interpolation and would otherwise substitute
# empty strings into every port and password.
- name: Link .env to mailcow.conf
  ansible.builtin.file:
    src: mailcow.conf
    dest: "{{ mailcow_app_dir }}/.env"
    state: link
    owner: root
    group: root
    # The link target is created by config.yml, which runs next.
    force: true
    follow: false
