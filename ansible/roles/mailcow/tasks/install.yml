---
# generate_config.sh is never run. It is interactive, it overwrites
# mailcow.conf rather than merging into it, and — the reason that settles it —
# its IPv6 step offers to rewrite /etc/docker/daemon.json and restart the
# Docker daemon, which on this host would bounce all nine unrelated stacks.
# The tree is checked out at a pinned tag and this role owns the config.
# Recorded as deviation CONF-1 in the decision log.

# jq is not a build dependency, it is a runtime one: certs.yml reads Traefik's
# ACME store with it, and the certificate sync script does too — so a host
# without it loses certificate renewal silently, months later.
- name: Install the packages the role shells out to
  ansible.builtin.apt:
    name:
      - jq
      - git
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the stack directory
  ansible.builtin.file:
    path: "{{ mailcow_app_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

# The working tree is never clean once the stack has run: postfix.sh truncates
# data/conf/postfix/main.cf at its "# Overrides #" marker and appends extra.cf
# on every container start. That is upstream's design, not drift, so a plain
# checkout with force:false fails on the second run and one with force:true
# would report a change forever. Gating on the tag means the checkout simply
# does not run in steady state, which is what idempotence requires.
# ansible.builtin.git has no read-only mode: asking it for the current version
# means performing a checkout, which is the very thing this task exists to
# decide whether to do. Hence the raw command.
- name: Read the checked-out mailcow version # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: git -C {{ mailcow_app_dir }} describe --tags --exact-match
  register: mailcow_current_version
  changed_when: false
  failed_when: false

- name: Check out mailcow-dockerized at the pinned tag
  ansible.builtin.git:
    repo: "{{ mailcow_repo }}"
    dest: "{{ mailcow_app_dir }}"
    version: "{{ mailcow_version }}"
    depth: 1
    # Only reachable on a genuine version change, where discarding mailcow's
    # runtime rewrite of main.cf is the intended outcome — the new tag ships
    # its own, and postfix.sh re-appends extra.cf on the next start.
    force: true
  register: mailcow_checkout
  when: mailcow_current_version.stdout | trim != mailcow_version

# generate_config.sh insists on it, and although this role never calls that
# script, docker compose reads .env for variable interpolation and would
# otherwise substitute empty strings into every port and password.
- name: Link .env to mailcow.conf
  ansible.builtin.file:
    src: mailcow.conf
    dest: "{{ mailcow_app_dir }}/.env"
    state: link
    owner: root
    group: root
    # The link target is created by config.yml, which runs next.
    force: true
    follow: false
