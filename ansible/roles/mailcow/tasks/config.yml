---
# Everything this role owns, rendered over the upstream checkout. The
# upstream tree itself is never edited, so bumping mailcow_version stays a
# clean checkout rather than a merge conflict.

- name: Render mailcow.conf
  ansible.builtin.template:
    src: mailcow.conf.j2
    dest: "{{ mailcow_app_dir }}/mailcow.conf"
    owner: root
    group: root
    # Upstream chmods this to 0600 itself; matching it keeps a run from
    # reporting a change every time update.sh has touched the tree.
    mode: "0600"
  no_log: true
  notify: Recreate mailcow

- name: Render the compose override
  ansible.builtin.template:
    src: docker-compose.override.yml.j2
    dest: "{{ mailcow_app_dir }}/docker-compose.override.yml"
    owner: root
    group: root
    mode: "0640"
  notify: Recreate mailcow

# nginx refuses to start without a certificate on disk, and with
# SKIP_LETS_ENCRYPT=y nothing inside mailcow ever creates one. Traefik will not
# issue the real certificate until a router exists for the host, and that
# router is a label on the nginx container — so without a placeholder the two
# wait on each other forever. generate_config.sh solves this by seeding a
# snake-oil certificate; this does the same thing, and certsync overwrites it
# with the real one as soon as Traefik has it.
- name: Create the certificate directory
  ansible.builtin.file:
    path: "{{ mailcow_app_dir }}/data/assets/ssl"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Seed the DH parameters
  ansible.builtin.copy:
    src: "{{ mailcow_app_dir }}/data/assets/ssl-example/dhparams.pem"
    dest: "{{ mailcow_app_dir }}/data/assets/ssl/dhparams.pem"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
    force: false

# creates: makes this run once and never again, so the real certificate that
# replaces it is never overwritten on a later run.
- name: Seed a placeholder certificate so nginx can start
  ansible.builtin.shell:
    # umask first: the directory is 0755 and root's default umask would
    # create the key world-readable for the moment before the chmod below.
    # Short-lived and disposable, but there is no reason to leave the window.
    cmd: >-
      umask 077 && openssl req -x509 -newkey rsa:4096 -nodes -sha256 -days 365
      -keyout {{ mailcow_app_dir }}/data/assets/ssl/key.pem
      -out {{ mailcow_app_dir }}/data/assets/ssl/cert.pem
      -subj "/CN={{ mailcow_hostname }}"
    creates: "{{ mailcow_app_dir }}/data/assets/ssl/cert.pem"

- name: Restrict the placeholder key
  ansible.builtin.file:
    path: "{{ mailcow_app_dir }}/data/assets/ssl/key.pem"
    owner: root
    group: root
    mode: "0600"

- name: Render the Postfix TLS overrides
  ansible.builtin.template:
    src: postfix-extra.cf.j2
    dest: "{{ mailcow_app_dir }}/data/conf/postfix/extra.cf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart postfix

- name: Render the Dovecot TLS overrides
  ansible.builtin.template:
    src: dovecot-extra.conf.j2
    dest: "{{ mailcow_app_dir }}/data/conf/dovecot/extra.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart dovecot

- name: Install the certificate sync script
  ansible.builtin.template:
    src: certsync.sh.j2
    dest: /usr/local/sbin/{{ mailcow_cert_sync_unit }}.sh
    owner: root
    group: root
    mode: "0750"

- name: Install the certificate sync units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    owner: root
    group: root
    mode: "0644"
  loop:
    - "{{ mailcow_cert_sync_unit }}.service"
    - "{{ mailcow_cert_sync_unit }}.path"
  notify: Reload systemd
