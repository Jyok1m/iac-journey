---
# Runs before *every* terraform pass, not just the last: mail_dkim and
# mail_mta_sts_serving default to absent in the HCL, so a pass that omitted
# them would plan to delete a live DKIM record. Both are maps keyed by domain,
# so a missing key keeps that record out of the plan without touching the rest.

- name: Check whether the mailcow API is answering yet
  ansible.builtin.uri:
    url: "{{ mailcow_api_url }}/api/v1/get/status/containers"
    method: GET
    headers:
      X-API-Key: "{{ mailcow_vault_api_key }}"
      Host: "{{ mailcow_hostname }}"
    status_code: [200, 401, 403]
    timeout: 10
  register: mailcow_api_probe
  failed_when: false
  changed_when: false
  no_log: true

# Unconditional: facts left from the earlier pass would survive a failed probe
# and republish a stale key as fresh.
- name: Start each pass with no DKIM key and no served policy assumed
  ansible.builtin.set_fact:
    mailcow_dkim: {}
    mailcow_mta_sts_serving: {}

- name: Read the DKIM key back out of mailcow, per domain
  ansible.builtin.uri:
    url: "{{ mailcow_api_url }}/api/v1/get/dkim/{{ item }}"
    method: GET
    headers:
      X-API-Key: "{{ mailcow_vault_api_key }}"
      Host: "{{ mailcow_hostname }}"
    status_code: 200
    timeout: 10
  register: mailcow_dkim_read
  failed_when: false
  changed_when: false
  # The response carries privkey alongside the public record.
  no_log: true
  loop: "{{ mailcow_domain_names }}"
  when: mailcow_api_probe.status | default(0) == 200

# dkim_txt and not pubkey: mailcow has already split the key across the
# 255-byte boundary. The empty-string guard matters — mailcow answers 200 with
# an empty dkim_txt for a domain it has not keyed, and publishing that is a
# valid record meaning "revoked, treat every signature as broken".
- name: Note the DKIM record value for each domain that has one
  ansible.builtin.set_fact:
    mailcow_dkim: "{{ mailcow_dkim | combine({item.item: item.json.dkim_txt}) }}"
  loop: "{{ mailcow_dkim_read.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('') }}"
  no_log: true
  when:
    - not (item.skipped | default(false))
    - item.json is defined
    - item.json.dkim_txt | default('') | length > 0

# Announcing the TXT before the policy answers makes every sender fetch a 404
# and file a TLS-RPT failure — per-domain, which is why the gate is too.
- name: Check whether the MTA-STS policy is actually being served
  ansible.builtin.uri:
    url: "https://mta-sts.{{ item }}/.well-known/mta-sts.txt"
    method: GET
    status_code: 200
    timeout: 10
    return_content: true
  register: mailcow_mta_sts_probe
  failed_when: false
  changed_when: false
  delegate_to: localhost
  # A task-level `become: false` loses to ansible_become on a delegated task.
  vars:
    ansible_become: false
  loop: "{{ mailcow_mta_sts_domains }}"

- name: Note which domains have a policy being served
  ansible.builtin.set_fact:
    mailcow_mta_sts_serving: >-
      {{ mailcow_mta_sts_serving | combine({
           item.item: (item.status | default(0) == 200
                       and 'STSv1' in (item.content | default(''))),
         }) }}
  loop: "{{ mailcow_mta_sts_probe.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"

# mail.generated.auto.tfvars is the last state terraform was told to publish,
# not a live report: overwriting it with nothing because mailcow was
# unreachable plans to DELETE a working domain's DKIM record. So it is only
# rewritten when every question got an answer — "no key yet" counts, "no
# answer" does not.
- name: Decide whether mailcow answered well enough to rewrite the inputs
  ansible.builtin.set_fact:
    mailcow_tf_vars_answered: >-
      {{ mailcow_api_probe.status | default(0) == 200
         and (mailcow_dkim_read.results | default([])
              | selectattr('status', 'defined')
              | selectattr('status', 'eq', 200)
              | list | length) == (mailcow_domain_names | length) }}

- name: Report that the generated inputs are being left alone
  ansible.builtin.debug:
    msg: |
      mailcow did not answer, so {{ mailcow_terraform_dir }}/mail.generated.auto.tfvars
      is left as it is and terraform will re-publish the DKIM keys and MTA-STS
      switches already recorded there.

      This is normal on the first pass of a deploy: the stack is not up yet, and
      this pass is what publishes the DNS it needs in order to come up. The keys
      are read for real on the second pass, after the domains exist.

      If it is still saying this after the stack is up, the API is the problem,
      not the DNS:
        curl -H "X-API-Key: ..." -H "Host: {{ mailcow_hostname }}" \
          {{ mailcow_api_url }}/api/v1/get/status/containers
  when: not mailcow_tf_vars_answered

# In the terraform directory rather than passed as -var, so a bare
# `terraform plan` is honest.
- name: Write the generated terraform inputs
  ansible.builtin.template:
    src: mail.generated.auto.tfvars.j2
    dest: "{{ mailcow_terraform_dir }}/mail.generated.auto.tfvars"
    mode: "0644"
  delegate_to: localhost
  vars:
    ansible_become: false
  run_once: true
  when: mailcow_tf_vars_answered
