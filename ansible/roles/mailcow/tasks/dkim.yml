---
# The second DNS pass, and the reason the DNS work is split in two. The DKIM
# key does not exist until mailcow has generated it for the domain, which
# cannot happen before the stack is running — so it cannot be part of the
# pass that has to precede the stack coming up.
#
# tf_vars.yml re-reads the current state rather than assuming this pass is
# the one that introduces the key, which is what lets the same include run on
# a steady-state re-run and plan nothing.

- name: Re-read what terraform can know now that mailcow is up
  ansible.builtin.import_tasks: tf_vars.yml

- name: Assert mailcow has generated a DKIM key
  ansible.builtin.assert:
    that:
      - mailcow_dkim_txt | length > 0
    fail_msg: >-
      mailcow has no DKIM key for {{ mailcow_domain }}. The domain was created
      with dkim_selector={{ mailcow_dkim_selector }}, so this means the
      generation failed. Check
      `curl -H "X-API-Key: ..." {{ mailcow_api_url }}/api/v1/get/dkim/{{ mailcow_domain }}`.
    quiet: true

- name: Publish the DKIM record
  ansible.builtin.include_tasks: terraform_apply.yml
  vars:
    mailcow_tf_purpose: DKIM and MTA-STS

- name: Wait for the DKIM record to resolve
  ansible.builtin.command:
    argv:
      - dig
      - +short
      - "@{{ item }}"
      - "{{ mailcow_dkim_selector }}._domainkey.{{ mailcow_domain }}"
      - TXT
  delegate_to: localhost
  # A task-level `become: false` does not override ansible_become for a
  # delegated task — the variable wins. This has to be set as a var.
  vars:
    ansible_become: false
  run_once: true
  register: mailcow_dkim_dns
  changed_when: false
  until: "'v=DKIM1' in mailcow_dkim_dns.stdout"
  retries: "{{ mailcow_dns_propagation_retries }}"
  delay: "{{ mailcow_dns_propagation_delay }}"
  loop: "{{ mailcow_dns_resolvers }}"
  loop_control:
    label: "@{{ item }}"

# mailcow signs with the key it holds; DNS advertises the key terraform
# published. If a rebuild regenerated the key without the DNS pass running,
# every signature would fail to verify while looking perfectly configured.
# Both sides are normalised the same way before comparing. A 2048-bit key is
# split across several quoted character-strings, and dig re-quotes them on the
# way out, so the quoting differs on each side while the key does not.
- name: Normalise both copies of the key for comparison
  ansible.builtin.set_fact:
    mailcow_dkim_local: "{{ mailcow_dkim_txt | regex_replace('[\" ]', '') }}"
    mailcow_dkim_published: "{{ mailcow_dkim_dns.results | map(attribute='stdout') | join(' ') | regex_replace('[\" ]', '') }}"

- name: Confirm the published key is the one mailcow signs with
  ansible.builtin.assert:
    that:
      - mailcow_dkim_local | length > 0
      - mailcow_dkim_local in mailcow_dkim_published
    fail_msg: >-
      The DKIM record in DNS is not the key mailcow signs with. Signatures
      would fail to verify while the configuration looked correct.
      mailcow holds ...{{ mailcow_dkim_local[-24:] | default('') }},
      DNS publishes ...{{ mailcow_dkim_published[-24:] | default('') }}.
    quiet: true
