---
# Each check fails with the action that fixes it, rather than with a stack
# trace three tasks later.

- name: Assert the vault is unlocked and complete
  ansible.builtin.assert:
    that:
      - mailcow_vault_dbpass | default('') | length > 0
      - mailcow_vault_dbroot | default('') | length > 0
      - mailcow_vault_redispass | default('') | length > 0
      - mailcow_vault_sogo_key | default('') | length == 16
      - mailcow_vault_api_key | default('') | length > 0
      - mailcow_vault_mailboxes | default({}) | length > 0
    fail_msg: >-
      ansible/vaults/mailcow.yml is missing or incomplete. It must define
      mailcow_vault_dbpass, mailcow_vault_dbroot, mailcow_vault_redispass,
      mailcow_vault_sogo_key (exactly 16 characters — SOGo derives its URL
      cipher from it and a different length breaks webmail links),
      mailcow_vault_api_key and mailcow_vault_mailboxes.
    quiet: true

# A key with other characters is silently truncated at lookup, and every API
# call in this role returns 401 with no explanation.
- name: Assert the API key uses the charset mailcow accepts
  ansible.builtin.assert:
    that:
      - mailcow_vault_api_key is match('^[A-Za-z0-9-]+$')
    fail_msg: >-
      mailcow_vault_api_key may only contain a-z, A-Z, 0-9 and '-'.
      mailcow strips every other character before looking the key up, so a
      key with other characters authenticates as nothing.
    quiet: true

# Keyed by the full address: no-reply exists on two domains here.
- name: Assert every mailbox has a password in the vault
  ansible.builtin.assert:
    that:
      - item.address in (mailcow_vault_mailboxes | default({}))
    fail_msg: >-
      mailcow_vault_mailboxes has no entry for {{ item.address }}. The map is
      keyed by the full address — an entry keyed on the local part alone is
      ignored. Add it with `ansible-vault edit ansible/vaults/mailcow.yml`.
    quiet: true
  loop: "{{ mailcow_mailboxes }}"
  loop_control:
    label: "{{ item.address }}"

- name: Assert no address is declared twice
  ansible.builtin.assert:
    that:
      - mailcow_mailboxes | map(attribute='address') | list | length ==
        mailcow_mailboxes | map(attribute='address') | unique | list | length
      - mailcow_aliases | map(attribute='address') | list | length ==
        mailcow_aliases | map(attribute='address') | unique | list | length
      - mailcow_mailboxes | map(attribute='address') | select('in', mailcow_aliases | map(attribute='address') | list) | list | length == 0
    fail_msg: >-
      An address appears twice across mailcow_mailboxes and mailcow_aliases.
      mailcow accepts the first and rejects the second with a 200 and a
      "already exists" message, so the run would report success while one of
      the two silently did not exist.
    quiet: true

- name: Assert the hostname's own zone is one of the mail domains
  ansible.builtin.assert:
    that:
      - mailcow_domain in mailcow_domain_names
    fail_msg: >-
      mailcow_domain ({{ mailcow_domain }}) is not in mailcow_domains. The
      hostname's A/AAAA and the report mailboxes live in that zone, so it has
      to be a domain mailcow serves.
    quiet: true

# The two lists have no shared source, so they are compared instead. A domain
# in one and not the other looks like a working deployment: mailboxes with no
# MX, or an MX for a domain mailcow rejects at RCPT TO — a backscatter source.
- name: Read the terraform mail inputs
  ansible.builtin.set_fact:
    mailcow_tf_domains: >-
      {{ lookup('ansible.builtin.file', mailcow_terraform_dir ~ '/mail.auto.tfvars')
         | regex_findall('"([^"]+)"\s*=\s*\{') }}
  delegate_to: localhost
  # A task-level `become: false` loses to ansible_become on a delegated task.
  vars:
    ansible_become: false
  run_once: true

- name: Assert ansible and terraform agree on the mail domains
  ansible.builtin.assert:
    that:
      - mailcow_tf_domains | sort == mailcow_domain_names | sort
    fail_msg: >-
      mailcow_domains lists {{ mailcow_domain_names | sort | join(', ') }},
      but mail_domains in {{ mailcow_terraform_dir }}/mail.auto.tfvars lists
      {{ mailcow_tf_domains | sort | join(', ') }}. Both have to name the same
      domains.
    quiet: true

- name: Collect the container engine state
  ansible.builtin.command:
    cmd: docker info --format {{ '{{.Swarm.LocalNodeState}}' }}
  register: mailcow_swarm_state
  changed_when: false

# Upstream is explicit that Swarm is unsupported.
- name: Assert Docker is not in Swarm mode
  ansible.builtin.assert:
    that:
      - mailcow_swarm_state.stdout | trim == 'inactive'
    fail_msg: >-
      Docker reports Swarm state '{{ mailcow_swarm_state.stdout | trim }}'.
      mailcow-dockerized is not supported on Swarm. Leave the swarm before
      running this role.
    quiet: true

- name: Check whether outbound SMTP is reachable
  ansible.builtin.command:
    cmd: >-
      timeout 10 python3 -c
      "import socket,sys; s=socket.create_connection(('gmail-smtp-in.l.google.com',25),8);
      sys.stdout.write(s.recv(64).decode(errors='replace')); s.close()"
  register: mailcow_port25
  changed_when: false
  failed_when: false
  when: mailcow_require_port25_egress

# OVH blocks outbound 25 on some accounts and only lifts it on request. The
# failure looks like a queue that never drains.
- name: Assert outbound port 25 is open
  ansible.builtin.assert:
    that:
      - mailcow_port25.rc == 0
      - "'220' in mailcow_port25.stdout"
    fail_msg: >-
      No SMTP banner from gmail-smtp-in.l.google.com:25. OVH blocks outbound
      port 25 by default on some accounts. Open a request in the OVH manager
      to have it unblocked, then re-run. Set mailcow_require_port25_egress
      to false to build anyway, knowing outbound mail will not deliver.
    quiet: true
  when: mailcow_require_port25_egress

- name: Read the docker networks
  community.docker.docker_host_info:
    networks: true
    networks_filters:
      name: "{{ mailcow_traefik_network }}"
  register: mailcow_networks

# mailcow attaches to it as external, and compose will not create it.
- name: Assert the Traefik network exists
  ansible.builtin.assert:
    that:
      - mailcow_networks.networks | length > 0
    fail_msg: >-
      Docker network '{{ mailcow_traefik_network }}' does not exist. Run the
      traefik role before this one.
    quiet: true

# Docker reports an overlap only at network-create time, from inside a compose
# run already doing work, and names neither the subnet nor the network holding
# it. Its default pool is one /16 per network across 172.17–172.31, so a host
# with a stack per app runs out and a free value gets taken by the next role.
- name: Look for a docker network overlapping the pool mailcow wants
  ansible.builtin.shell:
    # bash: dash has no pipefail, and a failed docker would read as "no
    # overlap" on the far side of the pipe.
    executable: /bin/bash
    cmd: |
      set -o pipefail
      { docker network inspect $(docker network ls -q) 2>/dev/null || echo '[]'; } | python3 -c '
      import ipaddress, json, sys
      want = ipaddress.ip_network("{{ mailcow_ipv4_network }}.0/24")
      clash = []
      for n in json.load(sys.stdin):
          if n.get("Name") == "{{ mailcow_compose_project }}_mailcow-network":
              continue
          for c in (n.get("IPAM") or {}).get("Config") or []:
              subnet = c.get("Subnet")
              if not subnet:
                  continue
              try:
                  net = ipaddress.ip_network(subnet)
              except ValueError:
                  continue
              if net.version == 4 and net.overlaps(want):
                  clash.append("%s holds %s" % (n["Name"], subnet))
      print("; ".join(clash))'
  register: mailcow_subnet_clash
  changed_when: false
  check_mode: false

- name: Assert the pool mailcow wants is free
  ansible.builtin.assert:
    that:
      - mailcow_subnet_clash.stdout | trim | length == 0
    fail_msg: >-
      mailcow asks for {{ mailcow_ipv4_network }}.0/24 and
      {{ mailcow_subnet_clash.stdout | trim }}. Docker refuses an overlapping
      pool, so the stack would fail halfway through `compose up`. Move
      mailcow_ipv4_network to a free /24 — 172.16.0 sits one /16 below Docker's
      built-in default pool, so nothing will ever be auto-assigned on top of it.
    quiet: true

- name: Look for an existing mailcow deployment
  ansible.builtin.stat:
    path: "{{ mailcow_app_dir }}/docker-compose.yml"
  register: mailcow_existing_compose

# On a re-run mailcow itself holds the ports, so the assertion below is for a
# first install only.
- name: Record whether this is a first install
  ansible.builtin.set_fact:
    mailcow_already_deployed: "{{ mailcow_existing_compose.stat.exists }}"

- name: Look for anything already bound to the mail ports
  ansible.builtin.command:
    cmd: ss -tlnH
  register: mailcow_listeners
  changed_when: false
  when: not mailcow_already_deployed

- name: Assert the mail ports are free
  ansible.builtin.assert:
    that:
      - mailcow_listeners.stdout is not search(':' ~ item ~ '\s')
    fail_msg: >-
      Port {{ item }} is already bound on this host. mailcow needs it.
      Identify the holder with `ss -tlnp | grep :{{ item }}` before re-running.
    quiet: true
  loop: "{{ mailcow_ports.values() | list }}"
  loop_control:
    label: "{{ item }}"
  when: not mailcow_already_deployed
