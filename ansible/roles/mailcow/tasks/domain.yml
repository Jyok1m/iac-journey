---
# mailcow's API is add-or-nothing: POST /add/domain on an existing domain
# returns a "domain_exists" message with HTTP 200 rather than an error. So
# every task here reads first and only writes what is missing, which is what
# makes a second run report no change.
#
# Mailboxes are addressed by their full address throughout, and the local part
# and domain are split out of it at the point of the call. Carrying a separate
# local/domain pair around invites the one bug this layout cannot have:
# no-reply exists on two of these domains, so anything keyed on the local part
# alone collides.

- name: Read the domains mailcow already has
  ansible.builtin.uri:
    url: "{{ mailcow_api_url }}/api/v1/get/domain/all"
    method: GET
    headers:
      X-API-Key: "{{ mailcow_vault_api_key }}"
      Host: "{{ mailcow_hostname }}"
    status_code: 200
  register: mailcow_domains_present
  changed_when: false
  no_log: true

- name: Create the mail domains
  ansible.builtin.uri:
    url: "{{ mailcow_api_url }}/api/v1/add/domain"
    method: POST
    headers:
      X-API-Key: "{{ mailcow_vault_api_key }}"
      Host: "{{ mailcow_hostname }}"
      Content-Type: application/json
    body_format: json
    body:
      domain: "{{ item }}"
      description: "{{ item }} — managed by the ansible mailcow role"
      aliases: 400
      mailboxes: 50
      defquota: 3072
      maxquota: 10240
      quota: 51200
      active: 1
      # Creating the DKIM key with the domain removes a round trip and makes
      # the key available to the DNS pass that follows immediately after.
      dkim_selector: "{{ mailcow_dkim_selector }}"
      key_size: "{{ mailcow_dkim_key_size }}"
    status_code: 200
  loop: "{{ mailcow_domain_names }}"
  when: item not in (mailcow_domains_present.json | default([]) | map(attribute='domain_name') | list)
  changed_when: true
  # SOGo reads the domain list once, at its own start. Creating a domain here
  # without bouncing it leaves the webmail answering "Unauthorized" to every
  # mailbox in that domain, while IMAP and SMTP work — which reads as a broken
  # password rather than as a stale container.
  notify: Restart sogo

- name: Read the mailboxes mailcow already has
  ansible.builtin.uri:
    url: "{{ mailcow_api_url }}/api/v1/get/mailbox/all"
    method: GET
    headers:
      X-API-Key: "{{ mailcow_vault_api_key }}"
      Host: "{{ mailcow_hostname }}"
    status_code: 200
  register: mailcow_existing_mailboxes
  changed_when: false
  no_log: true

# Only ever creates. A password changed in the vault is NOT pushed to an
# existing mailbox — mailcow would accept the edit, but the app passwords
# derived from it stay valid and the two copies would silently diverge.
# Rotating a password is a deliberate act: change it in the UI, then in the
# vault, in that order.
- name: Create the mailboxes
  ansible.builtin.uri:
    url: "{{ mailcow_api_url }}/api/v1/add/mailbox"
    method: POST
    headers:
      X-API-Key: "{{ mailcow_vault_api_key }}"
      Host: "{{ mailcow_hostname }}"
      Content-Type: application/json
    body_format: json
    body:
      local_part: "{{ item.address.split('@')[0] }}"
      domain: "{{ item.address.split('@')[1] }}"
      name: "{{ item.name }}"
      quota: "{{ item.quota }}"
      password: "{{ mailcow_vault_mailboxes[item.address] }}"
      password2: "{{ mailcow_vault_mailboxes[item.address] }}"
      active: 1
    status_code: 200
  loop: "{{ mailcow_mailboxes }}"
  loop_control:
    label: "{{ item.address }}"
  when: >-
    item.address not in
    (mailcow_existing_mailboxes.json | default([]) | map(attribute='username') | list)
  changed_when: true
  no_log: true

- name: Read the aliases mailcow already has
  ansible.builtin.uri:
    url: "{{ mailcow_api_url }}/api/v1/get/alias/all"
    method: GET
    headers:
      X-API-Key: "{{ mailcow_vault_api_key }}"
      Host: "{{ mailcow_hostname }}"
    status_code: 200
  register: mailcow_existing_aliases
  changed_when: false
  no_log: true

# postmaster and abuse are RFC 2142 obligations, and the DMARC and TLS-RPT
# records name mailboxes that have to exist or the reports bounce and the
# receiving side stops sending them.
- name: Create the aliases
  ansible.builtin.uri:
    url: "{{ mailcow_api_url }}/api/v1/add/alias"
    method: POST
    headers:
      X-API-Key: "{{ mailcow_vault_api_key }}"
      Host: "{{ mailcow_hostname }}"
      Content-Type: application/json
    body_format: json
    body:
      address: "{{ item.address }}"
      goto: "{{ item.goto }}"
      active: 1
    status_code: 200
  loop: "{{ mailcow_aliases }}"
  loop_control:
    label: "{{ item.address }}"
  when: >-
    item.address not in
    (mailcow_existing_aliases.json | default([]) | map(attribute='address') | list)
  changed_when: true
