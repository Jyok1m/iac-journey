---
# mailcow's API is add-or-nothing — POST /add/domain on an existing domain
# answers 200 with "domain_exists" — so every task reads first and writes only
# what is missing. Mailboxes are keyed by full address throughout: no-reply
# exists on two of these domains.

- name: Read the domains mailcow already has
  ansible.builtin.uri:
    url: "{{ mailcow_api_url }}/api/v1/get/domain/all"
    method: GET
    headers:
      X-API-Key: "{{ mailcow_vault_api_key }}"
      Host: "{{ mailcow_hostname }}"
    status_code: 200
  register: mailcow_domains_present
  changed_when: false
  no_log: true

- name: Create the mail domains
  ansible.builtin.uri:
    url: "{{ mailcow_api_url }}/api/v1/add/domain"
    method: POST
    headers:
      X-API-Key: "{{ mailcow_vault_api_key }}"
      Host: "{{ mailcow_hostname }}"
      Content-Type: application/json
    body_format: json
    body:
      domain: "{{ item }}"
      description: "{{ item }} — managed by the ansible mailcow role"
      aliases: 400
      mailboxes: 50
      defquota: 3072
      maxquota: 10240
      quota: 51200
      active: 1
      # Makes the key available to the DNS pass that follows.
      dkim_selector: "{{ mailcow_dkim_selector }}"
      key_size: "{{ mailcow_dkim_key_size }}"
    status_code: 200
  loop: "{{ mailcow_domain_names }}"
  when: item not in (mailcow_domains_present.json | default([]) | map(attribute='domain_name') | list)
  changed_when: true
  # SOGo reads the domain list once at its own start: without a bounce the
  # webmail answers "Unauthorized" while IMAP and SMTP work.
  notify: Restart sogo

- name: Read the mailboxes mailcow already has
  ansible.builtin.uri:
    url: "{{ mailcow_api_url }}/api/v1/get/mailbox/all"
    method: GET
    headers:
      X-API-Key: "{{ mailcow_vault_api_key }}"
      Host: "{{ mailcow_hostname }}"
    status_code: 200
  register: mailcow_existing_mailboxes
  changed_when: false
  no_log: true

# Only ever creates: a vault password change is not pushed to an existing
# mailbox, since the app passwords derived from it would stay valid. Rotate in
# the UI first, then in the vault.
- name: Create the mailboxes
  ansible.builtin.uri:
    url: "{{ mailcow_api_url }}/api/v1/add/mailbox"
    method: POST
    headers:
      X-API-Key: "{{ mailcow_vault_api_key }}"
      Host: "{{ mailcow_hostname }}"
      Content-Type: application/json
    body_format: json
    body:
      local_part: "{{ item.address.split('@')[0] }}"
      domain: "{{ item.address.split('@')[1] }}"
      name: "{{ item.name }}"
      quota: "{{ item.quota }}"
      password: "{{ mailcow_vault_mailboxes[item.address] }}"
      password2: "{{ mailcow_vault_mailboxes[item.address] }}"
      active: 1
    status_code: 200
  loop: "{{ mailcow_mailboxes }}"
  loop_control:
    label: "{{ item.address }}"
  when: >-
    item.address not in
    (mailcow_existing_mailboxes.json | default([]) | map(attribute='username') | list)
  changed_when: true
  no_log: true

- name: Read the aliases mailcow already has
  ansible.builtin.uri:
    url: "{{ mailcow_api_url }}/api/v1/get/alias/all"
    method: GET
    headers:
      X-API-Key: "{{ mailcow_vault_api_key }}"
      Host: "{{ mailcow_hostname }}"
    status_code: 200
  register: mailcow_existing_aliases
  changed_when: false
  no_log: true

# RFC 2142 obligations, and the DMARC and TLS-RPT records name mailboxes that
# have to exist or the reports bounce and senders stop sending them.
- name: Create the aliases
  ansible.builtin.uri:
    url: "{{ mailcow_api_url }}/api/v1/add/alias"
    method: POST
    headers:
      X-API-Key: "{{ mailcow_vault_api_key }}"
      Host: "{{ mailcow_hostname }}"
      Content-Type: application/json
    body_format: json
    body:
      address: "{{ item.address }}"
      goto: "{{ item.goto }}"
      active: 1
    status_code: 200
  loop: "{{ mailcow_aliases }}"
  loop_control:
    label: "{{ item.address }}"
  when: >-
    item.address not in
    (mailcow_existing_aliases.json | default([]) | map(attribute='address') | list)
  changed_when: true
