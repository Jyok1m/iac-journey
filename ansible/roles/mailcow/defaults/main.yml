---
# Default Role
mailcow_app_name: mailcow
mailcow_app_dir: /opt/{{ mailcow_app_name }}

# Upstream checkout. Pinned to a release tag rather than tracking master:
# update.sh rewrites mailcow.conf in place, and this role owns that file.
# Bumping this variable is the supported way to upgrade.
mailcow_repo: https://github.com/mailcow/mailcow-dockerized.git
mailcow_version: 2026-07a

# ------------------------------ Identity ------------------------------ #
# MAILCOW_HOSTNAME. This one name is simultaneously the SMTP HELO name
# (postfix myhostname), the PTR target, the CN of the certificate served on
# 25/465/587, and the web UI host. mailcow's docs require it to be a FQDN
# that is not the mail domain itself, hence the subdomain.
mailcow_hostname: mail.{{ portfolio_domain_com }}
mailcow_domain: "{{ portfolio_domain_com }}"
mailcow_timezone: Europe/Paris

# Names Traefik routes to mailcow besides the hostname. mailcow's nginx
# answers with the wrong site for a server_name it does not know, so every
# one of these has to appear in ADDITIONAL_SERVER_NAMES too.
mailcow_additional_server_names:
  - autodiscover.{{ mailcow_domain }}
  - autoconfig.{{ mailcow_domain }}
  - mta-sts.{{ mailcow_domain }}

# ------------------------------ Networking ---------------------------- #
# Traefik owns host ports 80 and 443, so mailcow's nginx binds high ports on
# the loopback and is reached over the shared docker network instead.
# Host port and container port are the same value by mailcow's design — the
# compose file publishes ${HTTP_PORT}:${HTTP_PORT} and templates the same
# number into nginx's listen directive.
mailcow_http_bind: 127.0.0.1
mailcow_http_port: 8080
mailcow_https_bind: 127.0.0.1
mailcow_https_port: 8443

mailcow_traefik_network: "{{ traefik_public_network | default('traefik-public') }}"
mailcow_compose_project: mailcowdockerized

# Traefik's Host() matcher takes exactly one name — a multi-argument form is
# rejected with "unexpected number of parameters; got 4, expected one of [1]"
# and the whole router silently fails to build, leaving Traefik to answer its
# own 404. Several names means several Host() matchers joined by ||.
# The backticks are rule syntax, not quoting, so they reach the label verbatim.
mailcow_router_rule: >-
  {{ ([mailcow_hostname] + mailcow_additional_server_names)
     | map('regex_replace', '^(.*)$', 'Host(`\1`)') | join(' || ') }}

# mailcow's own bridge. Upstream writes this as a three-octet prefix, not a
# CIDR, and appends the host part itself.
#
# Moved off upstream's 172.22.1 default: monitoring-internal already holds
# 172.22.0.0/16 on this host, and Docker refuses an overlapping pool outright.
# 172.21.0.0/16 is the one gap left between ipseis-internal (172.20) and
# monitoring (172.22); 172.31 is the only other. Changing this moves the
# gateway address, which has to stay in step with mailcow_api_allow_from.
mailcow_ipv4_network: 172.21.0
mailcow_ipv6_network: "fd4d:6169:6c63:6f77::/64"

# 125 GiB on this host, so nothing is trimmed for memory. ClamAV and the
# full-text index are the two that upstream disables on small machines.
mailcow_skip_clamd: false
mailcow_skip_fts: false
mailcow_fts_heap: 128
mailcow_fts_procs: 1

mailcow_acme_email: "{{ traefik_acme_email | default('joachim.jasmin-dev@proton.me') }}"

# IPv6 inside mailcow's bridge stays off. Turning it on requires
# /etc/docker/daemon.json and a Docker daemon restart, which would bounce all
# nine unrelated stacks on this host. Inbound IPv6 on the published ports
# works regardless — docker-proxy already listens on [::] — which is what
# internet.nl's reachability check measures. Revisit once the IPv6 PTR is set.
mailcow_enable_ipv6: false

# ------------------------------ Ports --------------------------------- #
mailcow_ports:
  smtp: 25
  smtps: 465
  submission: 587
  imap: 143
  imaps: 993
  pop: 110
  pops: 995
  sieve: 4190

# ------------------------------ TLS ----------------------------------- #
# acme-mailcow is disabled and Traefik is the single ACME client on this
# host. mailcow documents this path: "You can also use any external ACME
# client to obtain certificates, but you will need to make sure that they are
# copied to the correct location and a post-hook reloads affected containers."
# The post-hook here is a systemd path unit watching Traefik's store, so a
# renewal between Ansible runs still reaches Postfix and Dovecot.
mailcow_skip_lets_encrypt: true
mailcow_traefik_acme_store: /var/lib/traefik/acme.json
mailcow_traefik_acme_resolver: letsencrypt
mailcow_cert_sync_unit: mailcow-certsync

# ------------------------------ Mailboxes ------------------------------ #
# Passwords come from mailcow_vault_mailboxes, keyed by the local part.
mailcow_mailboxes:
  - {local: info, name: Info, quota: 3072}
  - {local: invoice, name: Invoice, quota: 3072}
  - {local: dmarc, name: DMARC reports, quota: 1024}

# Report destinations referenced by the DNS records. Kept as aliases rather
# than mailboxes so the addresses in the published DMARC and TLS-RPT records
# resolve without a second password to manage.
mailcow_aliases:
  - {address: "postmaster@{{ mailcow_domain }}", goto: "info@{{ mailcow_domain }}"}
  - {address: "abuse@{{ mailcow_domain }}", goto: "info@{{ mailcow_domain }}"}
  - {address: "tls-reports@{{ mailcow_domain }}", goto: "dmarc@{{ mailcow_domain }}"}

# ------------------------------ API ------------------------------------ #
# API_KEY is only honoured when API_ALLOW_FROM validates to a non-empty list;
# the phpfpm entrypoint nests the key insert inside that check. The gateway of
# mailcow's own bridge is the address the container sees for a call made from
# the host over the published loopback port, which is why it is derived from
# mailcow_ipv4_network rather than written out.
mailcow_api_allow_from:
  - 127.0.0.1
  - "{{ mailcow_ipv4_network }}.1"
mailcow_api_url: "http://{{ mailcow_http_bind }}:{{ mailcow_http_port }}"

# ------------------------------ Keycloak ------------------------------- #
# Provider mode "keycloak" rather than "generic-oidc": generic-oidc has no
# case in mailcow's user_login() switch, so those users can authenticate
# nowhere outside a browser session. Neither mode covers IMAP or SMTP —
# Dovecot advertises only PLAIN and LOGIN — so mail clients use app
# passwords. Recorded as deviation SSO-1 in the decision log.
mailcow_keycloak_enabled: true
mailcow_keycloak_url: https://sso.{{ portfolio_domain_com }}
mailcow_keycloak_realm: homelab
mailcow_keycloak_client_id: mailcow
# mailcow's bundled provider only requests the openid scope when this parses
# as >= 20.0.0. Left blank there is no id_token and the flow fails silently.
mailcow_keycloak_version: 26.7.0
mailcow_keycloak_redirect_url: https://{{ mailcow_hostname }}

# ------------------------------ Terraform ------------------------------ #
# Runs on the control node, not the managed host: the state backend
# credentials and the Cloudflare token live there and are never copied.
mailcow_terraform_dir: "{{ playbook_dir }}/../terraform"
mailcow_terraform_backend_config: backend.hcl
# Written inside the terraform directory, which .gitignore already covers
# with the *.tfplan pattern, and removed again at the end of every pass.
mailcow_tf_plan_file: mailcow.tfplan
mailcow_dkim_selector: dkim
mailcow_dkim_key_size: 2048

# How long to wait for a freshly applied record to be visible from a public
# resolver before giving up. ACME fails outright if it runs first.
mailcow_dns_propagation_retries: 30
mailcow_dns_propagation_delay: 10
mailcow_dns_resolvers:
  - 1.1.1.1
  - 8.8.8.8

# Checked against a public resolver before the stack is allowed to come up.
# Deliberately not the whole record set — these are the ones ACME and mail
# delivery genuinely cannot start without.
mailcow_dns_required_records:
  - {name: "{{ mailcow_hostname }}", type: A}
  - {name: "{{ mailcow_hostname }}", type: AAAA}
  - {name: "{{ mailcow_domain }}", type: MX}
  - {name: "{{ mailcow_domain }}", type: TXT}
  - {name: "autoconfig.{{ mailcow_domain }}", type: CNAME}
  - {name: "autodiscover.{{ mailcow_domain }}", type: CNAME}
  - {name: "mta-sts.{{ mailcow_domain }}", type: CNAME}

# Checked at the end of a run but not before it — these only exist once
# mailcow has generated the key and started serving the policy.
mailcow_dns_verify_extra:
  - {name: "_dmarc.{{ mailcow_domain }}", type: TXT}
  - {name: "{{ mailcow_dkim_selector }}._domainkey.{{ mailcow_domain }}", type: TXT}

# Each of these hosts answers on a specific path, not on /. autodiscover and
# autoconfig return 404 at the root by design, so checking / would report a
# working deployment as broken.
mailcow_http_checks:
  - {host: "{{ mailcow_hostname }}", path: /, name: web UI}
  - {host: "autoconfig.{{ mailcow_domain }}", path: "/mail/config-v1.1.xml?emailaddress=postmaster@{{ mailcow_domain }}", name: Thunderbird autoconfig}
  - {host: "autodiscover.{{ mailcow_domain }}", path: /autodiscover/autodiscover.xml, name: Outlook autodiscover}

# internet.nl only tests port 25, but a client that cannot connect on 465 or
# 993 is broken regardless of what the score says.
mailcow_tls_checks:
  - {port: 25, starttls: "-starttls smtp"}
  - {port: 465, starttls: ""}
  - {port: 587, starttls: "-starttls smtp"}
  - {port: 993, starttls: ""}

# The address the mail records must resolve to. Read from the same tfvars the
# terraform side uses, so the two cannot drift apart silently.
mailcow_server_ipv4: "{{ (lookup('ansible.builtin.file', mailcow_terraform_dir ~ '/mail.auto.tfvars')
                          | regex_search('mail_server_ipv4\\s*=\\s*\"([^\"]+)\"', '\\1'))[0] }}"
mailcow_server_ipv6: "{{ (lookup('ansible.builtin.file', mailcow_terraform_dir ~ '/mail.auto.tfvars')
                          | regex_search('mail_server_ipv6\\s*=\\s*\"([^\"]+)\"', '\\1'))[0] }}"

# ------------------------------ Preflight ------------------------------ #
# Set false only to build the stack knowing outbound mail will not deliver.
mailcow_require_ptr: true
mailcow_require_port25_egress: true
