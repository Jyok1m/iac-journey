---
mailcow_app_name: mailcow
mailcow_app_dir: /opt/{{ mailcow_app_name }}

# Pinned to a release tag: update.sh rewrites mailcow.conf in place, and this
# role owns that file. Bumping this variable is the supported upgrade path.
mailcow_repo: https://github.com/mailcow/mailcow-dockerized.git
mailcow_version: 2026-07a

# One name for the whole host: SMTP HELO, PTR target, certificate CN on
# 25/465/587, and web UI host. Must be a FQDN that is not a mail domain itself.
mailcow_hostname: mail.{{ portfolio_domain_com }}
mailcow_domain: "{{ portfolio_domain_com }}"
mailcow_timezone: Europe/Paris

# Mirrors mail_domains in terraform/mail.auto.tfvars — preflight refuses to run
# if the two disagree. A domain there but not here publishes an MX for a domain
# mailcow rejects at RCPT TO, which is a backscatter source.
# client_autoconfig costs a certificate for two extra names, so it stays off for
# domains that only ever send from no-reply.
mailcow_domains:
  - name: "{{ portfolio_domain_com }}"
    client_autoconfig: true
    mta_sts: true
  - name: ipseis.eu
    client_autoconfig: true
    mta_sts: true
  - name: odyssai.app
    client_autoconfig: false
    mta_sts: true

# Traefik owns 80/443, so mailcow's nginx binds high ports on the loopback.
# Host and container port are the same value by mailcow's design.
mailcow_http_bind: 127.0.0.1
mailcow_http_port: 8080
mailcow_https_bind: 127.0.0.1
mailcow_https_port: 8443

mailcow_traefik_network: "{{ traefik_public_network | default('traefik-public') }}"
mailcow_compose_project: mailcowdockerized

# Host() takes exactly one name — several names means several matchers joined
# by ||, or the router silently fails to build.
mailcow_router_rule: >-
  {{ ([mailcow_hostname] + mailcow_additional_server_names)
     | map('regex_replace', '^(.*)$', 'Host(`\1`)') | join(' || ') }}

# Three-octet prefix, not a CIDR: upstream appends the host part itself.
# 172.16.0 sits one /16 below Docker's default pool (172.17–172.31), all
# fifteen of which are taken on this host — so no future stack can claim it.
# The durable fix is default-address-pools in daemon.json, which needs a daemon
# restart and would bounce nine other stacks. Same reason ENABLE_IPV6 stays off.
mailcow_ipv4_network: 172.16.0
mailcow_ipv6_network: "fd4d:6169:6c63:6f77::/64"

mailcow_skip_clamd: false
mailcow_skip_fts: false
mailcow_fts_heap: 128
mailcow_fts_procs: 1

mailcow_acme_email: "{{ traefik_acme_email | default('joachim.jasmin-dev@proton.me') }}"

# Inbound IPv6 on the published ports works regardless — docker-proxy listens
# on [::]. Revisit once the IPv6 PTR is set.
mailcow_enable_ipv6: false

mailcow_ports:
  smtp: 25
  smtps: 465
  submission: 587
  imap: 143
  imaps: 993
  pop: 110
  pops: 995
  sieve: 4190

# Traefik is the single ACME client on this host; a systemd path unit watching
# its store copies the certificates over, so a renewal between Ansible runs
# still reaches Postfix and Dovecot.
mailcow_skip_lets_encrypt: true
mailcow_traefik_acme_store: /var/lib/traefik/acme.json
mailcow_traefik_acme_resolver: letsencrypt
mailcow_cert_sync_unit: mailcow-certsync

# Passwords come from mailcow_vault_mailboxes, keyed by the FULL address:
# no-reply exists on two domains here. preflight refuses to run unless every
# address below has an entry.
mailcow_mailboxes:
  - {address: "info@{{ portfolio_domain_com }}", name: Info, quota: 3072}
  - {address: "invoice@{{ portfolio_domain_com }}", name: Invoice, quota: 3072}
  - {address: "dmarc@{{ portfolio_domain_com }}", name: DMARC reports, quota: 1024}
  - {address: "newsletter@{{ portfolio_domain_com }}", name: Newsletter, quota: 2048}
  - {address: "no-reply@{{ portfolio_domain_com }}", name: No reply, quota: 1024}
  - {address: "alert@{{ portfolio_domain_com }}", name: Alerts, quota: 1024}
  - {address: helenedm@ipseis.eu, name: Hélène DM, quota: 5120}
  - {address: no-reply-dev@odyssai.app, name: No reply dev, quota: 1024}
  - {address: no-reply@odyssai.app, name: No reply, quota: 1024}

# postmaster and abuse are mandatory (RFC 2142) and must reach something that
# is actually read — which for odyssai.app means crossing domains.
mailcow_aliases:
  - {address: "postmaster@{{ portfolio_domain_com }}", goto: "info@{{ portfolio_domain_com }}"}
  - {address: "abuse@{{ portfolio_domain_com }}", goto: "info@{{ portfolio_domain_com }}"}
  - {address: "tls-reports@{{ portfolio_domain_com }}", goto: "dmarc@{{ portfolio_domain_com }}"}
  - {address: postmaster@ipseis.eu, goto: helenedm@ipseis.eu}
  - {address: abuse@ipseis.eu, goto: helenedm@ipseis.eu}
  - {address: postmaster@odyssai.app, goto: "info@{{ portfolio_domain_com }}"}
  - {address: abuse@odyssai.app, goto: "info@{{ portfolio_domain_com }}"}

# API_KEY is only honoured when API_ALLOW_FROM is non-empty. The gateway is the
# address the container sees for a call made over the published loopback port.
mailcow_api_allow_from:
  - 127.0.0.1
  - "{{ mailcow_ipv4_network }}.1"
mailcow_api_url: "http://{{ mailcow_http_bind }}:{{ mailcow_http_port }}"

# "keycloak" and not "generic-oidc": the latter has no case in mailcow's
# user_login() switch. Neither mode covers IMAP or SMTP — mail clients use app
# passwords. Deviation SSO-1 in the decision log.
mailcow_keycloak_enabled: true
mailcow_keycloak_url: https://sso.{{ portfolio_domain_com }}
mailcow_keycloak_realm: homelab
mailcow_keycloak_client_id: mailcow
# Below 20.0.0 the bundled provider skips the openid scope: no id_token, and
# the flow fails silently.
mailcow_keycloak_version: 26.7.0
mailcow_keycloak_redirect_url: https://{{ mailcow_hostname }}

# Terraform runs on the control node: the backend credentials and the
# Cloudflare token live there and are never copied.
mailcow_terraform_dir: "{{ playbook_dir }}/../terraform"
mailcow_terraform_backend_config: backend.hcl
mailcow_tf_plan_file: mailcow.tfplan
mailcow_dkim_selector: dkim
mailcow_dkim_key_size: 2048

# ACME fails outright if it runs before the records are visible publicly.
mailcow_dns_propagation_retries: 30
mailcow_dns_propagation_delay: 10
mailcow_dns_resolvers:
  - 1.1.1.1
  - 8.8.8.8

mailcow_tls_checks:
  - {port: 25, starttls: "-starttls smtp"}
  - {port: 465, starttls: ""}
  - {port: 587, starttls: "-starttls smtp"}
  - {port: 993, starttls: ""}

# Read from the same tfvars terraform uses, so the two cannot drift.
mailcow_server_ipv4: "{{ (lookup('ansible.builtin.file', mailcow_terraform_dir ~ '/mail.auto.tfvars')
                          | regex_search('mail_server_ipv4\\s*=\\s*\"([^\"]+)\"', '\\1'))[0] }}"
mailcow_server_ipv6: "{{ (lookup('ansible.builtin.file', mailcow_terraform_dir ~ '/mail.auto.tfvars')
                          | regex_search('mail_server_ipv6\\s*=\\s*\"([^\"]+)\"', '\\1'))[0] }}"

# Set false only to build the stack knowing outbound mail will not deliver.
mailcow_require_ptr: true
mailcow_require_port25_egress: true
