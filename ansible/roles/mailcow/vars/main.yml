---
# Everything here is DERIVED from mailcow_domains in defaults/main.yml, which
# is why it lives in vars/ and not in defaults/: these are not knobs, and a
# host_vars override of one of them would silently disagree with the domain
# list the rest of the role — and terraform — work from.
#
# The lists that need a per-domain loop are built by rendering a YAML fragment
# and parsing it back. Jinja has no comprehension, so the alternative is a
# chain of product/map/join that nobody can read six months later, or a flat
# list repeated once per domain that drifts the first time a domain is added.

mailcow_domain_names: >-
  {{ mailcow_domains | map(attribute='name') | list }}

mailcow_client_autoconfig_domains: >-
  {{ mailcow_domains | selectattr('client_autoconfig') | map(attribute='name') | list }}

mailcow_mta_sts_domains: >-
  {{ mailcow_domains | selectattr('mta_sts') | map(attribute='name') | list }}

# Names Traefik routes to mailcow besides the hostname. mailcow's nginx answers
# with the wrong site for a server_name it does not know, so every one of these
# has to appear in ADDITIONAL_SERVER_NAMES too — and every one of them becomes
# a certificate Traefik has to keep renewing, which is the whole reason
# client_autoconfig is a per-domain switch.
mailcow_additional_server_names: >-
  {{ (['autodiscover', 'autoconfig'] | product(mailcow_client_autoconfig_domains) | map('join', '.') | list)
     + (['mta-sts'] | product(mailcow_mta_sts_domains) | map('join', '.') | list) }}

# Checked against a public resolver before the stack is allowed to come up.
# Deliberately not the whole record set — these are the ones ACME and mail
# delivery genuinely cannot start without.
mailcow_dns_required_records: >-
  {{ _mailcow_dns_required_yaml | from_yaml }}

_mailcow_dns_required_yaml: |
  - {name: "{{ mailcow_hostname }}", type: A}
  - {name: "{{ mailcow_hostname }}", type: AAAA}
  {% for d in mailcow_domain_names %}
  - {name: "{{ d }}", type: MX}
  - {name: "{{ d }}", type: TXT}
  {% endfor %}
  {% for d in mailcow_client_autoconfig_domains %}
  - {name: "autoconfig.{{ d }}", type: CNAME}
  - {name: "autodiscover.{{ d }}", type: CNAME}
  {% endfor %}
  {% for d in mailcow_mta_sts_domains %}
  - {name: "mta-sts.{{ d }}", type: CNAME}
  {% endfor %}

# Checked at the end of a run but not before it — these only exist once mailcow
# has generated the key and started serving the policy.
mailcow_dns_verify_extra: >-
  {{ _mailcow_dns_verify_extra_yaml | from_yaml }}

_mailcow_dns_verify_extra_yaml: |
  {% for d in mailcow_domain_names %}
  - {name: "_dmarc.{{ d }}", type: TXT}
  - {name: "{{ mailcow_dkim_selector }}._domainkey.{{ d }}", type: TXT}
  {% endfor %}

# Each of these hosts answers on a specific path, not on /. autodiscover and
# autoconfig return 404 at the root by design, so checking / would report a
# working deployment as broken.
#
# mta-sts is deliberately NOT in this list. This mailcow build does not serve
# /.well-known/mta-sts.txt at all — it answers 404 on every domain, including
# one that has been up for months — so asserting on it would fail a deployment
# that is working exactly as designed. The policy is gated on a live 200 in
# tf_vars.yml, which is what keeps the TXT unpublished rather than pointing
# senders at a 404, and verify.yml reports the state instead of failing on it.
mailcow_http_checks: >-
  {{ _mailcow_http_checks_yaml | from_yaml }}

_mailcow_http_checks_yaml: |
  - {host: "{{ mailcow_hostname }}", path: /, name: web UI}
  {% for d in mailcow_client_autoconfig_domains %}
  - host: "autoconfig.{{ d }}"
    path: "/mail/config-v1.1.xml?emailaddress=postmaster@{{ d }}"
    name: "Thunderbird autoconfig ({{ d }})"
  - host: "autodiscover.{{ d }}"
    path: /autodiscover/autodiscover.xml
    name: "Outlook autodiscover ({{ d }})"
  {% endfor %}
