---
# Derived from mailcow_domains, hence vars/ and not defaults/: a host_vars
# override here would silently disagree with the domain list terraform uses.
# The per-domain lists are a rendered YAML fragment parsed back: Jinja has no
# comprehension, and the product/map/join chain is unreadable.

mailcow_domain_names: >-
  {{ mailcow_domains | map(attribute='name') | list }}

mailcow_client_autoconfig_domains: >-
  {{ mailcow_domains | selectattr('client_autoconfig') | map(attribute='name') | list }}

mailcow_mta_sts_domains: >-
  {{ mailcow_domains | selectattr('mta_sts') | map(attribute='name') | list }}

# mailcow's nginx answers with the wrong site for a server_name it does not
# know, so each of these must be in ADDITIONAL_SERVER_NAMES too, and each is
# one more certificate to renew, hence the per-domain switch.
mailcow_additional_server_names: >-
  {{ (['autodiscover', 'autoconfig'] | product(mailcow_client_autoconfig_domains) | map('join', '.') | list)
     + (['mta-sts'] | product(mailcow_mta_sts_domains) | map('join', '.') | list) }}

# Checked against a public resolver before the stack comes up: only the ones
# ACME and delivery cannot start without.
mailcow_dns_required_records: >-
  {{ _mailcow_dns_required_yaml | from_yaml }}

_mailcow_dns_required_yaml: |
  - {name: "{{ mailcow_hostname }}", type: A}
  - {name: "{{ mailcow_hostname }}", type: AAAA}
  {% for d in mailcow_domain_names %}
  - {name: "{{ d }}", type: MX}
  - {name: "{{ d }}", type: TXT}
  {% endfor %}
  {% for d in mailcow_client_autoconfig_domains %}
  - {name: "autoconfig.{{ d }}", type: CNAME}
  - {name: "autodiscover.{{ d }}", type: CNAME}
  {% endfor %}
  {% for d in mailcow_mta_sts_domains %}
  - {name: "mta-sts.{{ d }}", type: CNAME}
  {% endfor %}

# Checked at the end of a run only: they do not exist before it.
mailcow_dns_verify_extra: >-
  {{ _mailcow_dns_verify_extra_yaml | from_yaml }}

_mailcow_dns_verify_extra_yaml: |
  {% for d in mailcow_domain_names %}
  - {name: "_dmarc.{{ d }}", type: TXT}
  - {name: "{{ mailcow_dkim_selector }}._domainkey.{{ d }}", type: TXT}
  {% endfor %}

# Specific paths, not /: autodiscover and autoconfig 404 at the root by design.
# mta-sts is deliberately absent: this build does not serve the policy at all,
# so asserting on it would fail a working deployment. tf_vars.yml gates the TXT
# on a live 200 instead, and verify.yml reports rather than fails.
mailcow_http_checks: >-
  {{ _mailcow_http_checks_yaml | from_yaml }}

_mailcow_http_checks_yaml: |
  - {host: "{{ mailcow_hostname }}", path: /, name: web UI}
  {% for d in mailcow_client_autoconfig_domains %}
  - host: "autoconfig.{{ d }}"
    path: "/mail/config-v1.1.xml?emailaddress=postmaster@{{ d }}"
    name: "Thunderbird autoconfig ({{ d }})"
  - host: "autodiscover.{{ d }}"
    path: /autodiscover/autodiscover.xml
    name: "Outlook autodiscover ({{ d }})"
  {% endfor %}
