---
- name: Remove the cloud-init sshd drop-in
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf
    state: absent
  when: hardening_ssh_remove_cloud_init_dropin
  notify: Restart sshd

# validate runs `sshd -t` against the candidate file before it replaces the
# live one: a bad directive fails the task instead of producing a daemon that
# refuses to start on the next restart, with no way back in.
- name: Apply the sshd configuration
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd
