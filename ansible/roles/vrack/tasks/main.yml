---
- name: Validate the vRack inputs
  ansible.builtin.assert:
    that:
      - vrack_iface | length > 0
      - vrack_ip | length > 0
    fail_msg: >-
      vrack needs vrack_iface and vrack_ip, both defined in the host's
      host_vars.
    quiet: true

# 0600: netplan warns loudly about world-readable configs, and this one is
# rendered by root for root anyway.
- name: Deploy the vRack netplan config
  ansible.builtin.template:
    src: netplan.yaml.j2
    dest: "{{ vrack_netplan_file }}"
    owner: root
    group: root
    mode: "0600"
  notify: Apply netplan

# The check below reads live interface state, so the handler has to have run.
- name: Apply the network change now
  ansible.builtin.meta: flush_handlers

- name: Verify the interface carries the expected address
  ansible.builtin.command: ip -br addr show {{ vrack_iface }}
  register: vrack_iface_state
  changed_when: false
  retries: "{{ vrack_verify_retries }}"
  delay: "{{ vrack_verify_delay }}"
  until: vrack_ip in vrack_iface_state.stdout
