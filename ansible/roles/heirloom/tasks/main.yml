---
- name: Create stack directory
  ansible.builtin.file:
    path: "{{ heirloom_app_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Deploy env files
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ heirloom_app_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - "{{ heirloom_pg_env_file }}"
    - "{{ heirloom_api_env_file }}"
    - "{{ heirloom_web_env_file }}"
  no_log: true

- name: Deploy compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ heirloom_app_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"

- name: Pull images
  community.docker.docker_compose_v2_pull:
    project_src: "{{ heirloom_app_dir }}"
  register: heirloom_docker_compose_pull

# `compose run` only manages the dependencies of `migrate`, so it cannot
# reconcile a drifted network while the other services hold endpoints on it.
- name: Deploy database
  community.docker.docker_compose_v2:
    project_src: "{{ heirloom_app_dir }}"
    services:
      - db
    state: present
    wait: true
    wait_timeout: 120

# `prisma migrate deploy` is idempotent and says so on stdout, which is what
# keeps this from reporting a change on every run. Skipped under --check: a
# dry run must not migrate the production database.
- name: Run migrations
  ansible.builtin.command:
    cmd: docker compose --project-directory {{ heirloom_app_dir }} run --rm --no-deps migrate
  register: heirloom_migrate
  changed_when: >-
    'No pending migrations to apply' not in heirloom_migrate.stdout

- name: Deploy services
  community.docker.docker_compose_v2:
    project_src: "{{ heirloom_app_dir }}"
    state: present
    recreate: auto
    remove_orphans: true
    wait: true
    wait_timeout: 300

# Same wiring as odyssai and shobukapp. The media volume is not covered: it
# needs a file-level restic job of its own.
- name: Schedule database dumps
  ansible.builtin.include_role:
    name: backup_postgres
  vars:
    backup_postgres_name: "{{ heirloom_app_name }}"
    backup_postgres_container: "{{ heirloom_pg_container_name }}"
    backup_postgres_network: "{{ heirloom_app_name }}_private"
    backup_postgres_image: "{{ heirloom_pg_image }}"
    backup_postgres_user: "{{ heirloom_vault_db_user }}"
    backup_postgres_password: "{{ heirloom_vault_db_password }}"
    backup_postgres_db: "{{ heirloom_vault_db }}"
    backup_postgres_restic_repo: "{{ heirloom_backup_restic_repo }}"
    backup_postgres_restic_password: "{{ backup_mongo_vault_restic_password }}"
    backup_postgres_restic_env:
      AWS_ACCESS_KEY_ID: "{{ backup_mongo_vault_s3_access_key }}"
      AWS_SECRET_ACCESS_KEY: "{{ backup_mongo_vault_s3_secret_key }}"
    backup_postgres_on_calendar: "{{ heirloom_backup_on_calendar }}"
  tags: [heirloom, backup]
