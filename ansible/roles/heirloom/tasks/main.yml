---
- name: Create directory in /opt if it does not exist
  ansible.builtin.file:
    path: "{{ heirloom_app_dir }}"
    state: directory
    mode: "0755"

- name: Copy env file with backup
  ansible.builtin.copy:
    src: .env
    dest: "{{ heirloom_app_dir }}/.env"
    mode: "0644"
    backup: true

- name: Copy env file for web with backup
  ansible.builtin.copy:
    src: .env.web
    dest: "{{ heirloom_app_dir }}/.env.web"
    mode: "0644"
    backup: true

- name: Render template
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ heirloom_app_dir }}/docker-compose.yml"
    mode: "0644"

- name: Pull images
  community.docker.docker_compose_v2_pull:
    project_src: "{{ heirloom_app_dir }}"
  register: heirloom_docker_compose_pull

- name: Run migrations
  ansible.builtin.command:
    cmd: docker compose --project-directory {{ heirloom_app_dir }} run --rm migrate
  register: heirloom_migrate
  changed_when: true

- name: Deploy services
  community.docker.docker_compose_v2:
    project_src: "{{ heirloom_app_dir }}"
    state: present
    recreate: "{{ 'always' if (heirloom_docker_compose_pull.changed | default(false)) else 'auto' }}"
    wait: true
    wait_timeout: 120
