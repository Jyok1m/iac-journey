---
- name: Create stack directory
  ansible.builtin.file:
    path: "{{ heirloom_app_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Deploy env files
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ heirloom_app_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - "{{ heirloom_pg_env_file }}"
    - "{{ heirloom_api_env_file }}"
    - "{{ heirloom_web_env_file }}"
  no_log: true

- name: Deploy compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ heirloom_app_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"

- name: Pull images
  community.docker.docker_compose_v2_pull:
    project_src: "{{ heirloom_app_dir }}"
  register: heirloom_docker_compose_pull

# The database must be converged before the migration runs: `compose run` only
# manages the dependencies of `migrate`, so it cannot reconcile a drifted
# network while the other services still hold endpoints on it.
- name: Deploy database
  community.docker.docker_compose_v2:
    project_src: "{{ heirloom_app_dir }}"
    services:
      - db
    state: present
    wait: true
    wait_timeout: 120

# The image runs `prisma migrate deploy`, which is idempotent: it exits 0 with
# "No pending migrations to apply." when the schema is already current. Parsing
# that keeps the play honest instead of reporting a change on every run.
# Left skipped under --check (the default for `command`): a dry run must not
# migrate the production database.
- name: Run migrations
  ansible.builtin.command:
    cmd: docker compose --project-directory {{ heirloom_app_dir }} run --rm --no-deps migrate
  register: heirloom_migrate
  changed_when: >-
    'No pending migrations to apply' not in heirloom_migrate.stdout

- name: Deploy services
  community.docker.docker_compose_v2:
    project_src: "{{ heirloom_app_dir }}"
    state: present
    recreate: auto
    remove_orphans: true
    wait: true
    wait_timeout: 300
