---
- name: Create stack directory
  ansible.builtin.file:
    path: "{{ heirloom_app_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Deploy env files
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ heirloom_app_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - "{{ heirloom_pg_env_file }}"
    - "{{ heirloom_api_env_file }}"
    - "{{ heirloom_web_env_file }}"
  no_log: true

- name: Deploy compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ heirloom_app_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"

- name: Pull images
  community.docker.docker_compose_v2_pull:
    project_src: "{{ heirloom_app_dir }}"
  register: heirloom_docker_compose_pull

- name: Run migrations
  ansible.builtin.command:
    cmd: docker compose --project-directory {{ heirloom_app_dir }} run --rm migrate
  register: heirloom_migrate
  changed_when: true

- name: Deploy services
  community.docker.docker_compose_v2:
    project_src: "{{ heirloom_app_dir }}"
    state: present
    recreate: "{{ 'always' if (heirloom_docker_compose_pull.changed | default(false)) else 'auto' }}"
    remove_orphans: true
    wait: true
    wait_timeout: 300
