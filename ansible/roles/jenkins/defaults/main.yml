---
jenkins_app_name: jenkins
jenkins_app_dir: /opt/{{ jenkins_app_name }}

# Built on the host, then pushed so the tag is reproducible off-box. Needs the
# host logged in to the registry.
jenkins_image_name: jyok1m/jenkins
jenkins_image_tag: v1.0
jenkins_image: "{{ jenkins_image_name }}:{{ jenkins_image_tag }}"
jenkins_image_push: true
jenkins_base_image: jenkins/jenkins:2.541.1-jdk21@sha256:d1ea795c6facd7f549a21c40e5e43ffcc5fbc5f48683d9b24750f26e8079d772
jenkins_plugins:
  - blueocean
  - docker-workflow
  - json-path-api

# The build daemon pipelines talk to. Pinned rather than the floating `dind`
# tag: a silent engine upgrade under a CI runner breaks builds invisibly.
jenkins_dind_image: docker:29.7.1-dind@sha256:e8faad5a8dc5279dff929afc5449f2791736912fff9f99351d742db2fad01b4c
jenkins_dind_container_name: jenkins-dind

jenkins_gui_container_name: jenkins-gui

# The .com is canonical; the .fr permanently redirects to it.
jenkins_host: jenkins.{{ portfolio_domain_com }}
jenkins_redirect_host: jenkins.{{ portfolio_domain_fr }}

# Deploys over SSH via the docker gateway.
jenkins_host_user: jenkins
# Pre-seeded in the container's known_hosts.
jenkins_known_hosts:
  - github.com
