---
# First-run setup inside the running container: Jenkins reaches GitHub over
# SSH and deploys onto this host through the docker gateway. Each step is
# guarded, so a routine run is a no-op.

- name: Check for the Jenkins known_hosts file
  community.docker.docker_container_exec:
    container: "{{ jenkins_gui_container_name }}"
    command: test -f /var/jenkins_home/.ssh/known_hosts
  register: jenkins_known_hosts_check
  failed_when: false
  changed_when: false

- name: Seed known_hosts with the repository host keys
  community.docker.docker_container_exec:
    container: "{{ jenkins_gui_container_name }}"
    user: root
    command: >-
      bash -c "mkdir -p /var/jenkins_home/.ssh &&
      ssh-keyscan -t ed25519 {{ jenkins_known_hosts | join(' ') }} >> /var/jenkins_home/.ssh/known_hosts &&
      chown -R jenkins:jenkins /var/jenkins_home/.ssh"
  when: jenkins_known_hosts_check.rc != 0
  changed_when: true

- name: Ensure the jenkins system account exists on the host
  ansible.builtin.user:
    name: "{{ jenkins_host_user }}"
    shell: /bin/bash
    create_home: true
    groups: docker
    append: true

- name: Check for the Jenkins deploy keypair
  community.docker.docker_container_exec:
    container: "{{ jenkins_gui_container_name }}"
    command: test -f /var/jenkins_home/.ssh/deploy_key
  register: jenkins_deploy_key_check
  failed_when: false
  changed_when: false

# The private key never leaves the container; only the public half is read
# back out and authorized on the host.
- name: Generate the Jenkins deploy keypair
  community.docker.docker_container_exec:
    container: "{{ jenkins_gui_container_name }}"
    user: root
    command: >-
      bash -c "mkdir -p /var/jenkins_home/.ssh &&
      ssh-keygen -t ed25519 -C 'jenkins-deploy' -f /var/jenkins_home/.ssh/deploy_key -N '' &&
      chown -R jenkins:jenkins /var/jenkins_home/.ssh"
  when: jenkins_deploy_key_check.rc != 0
  changed_when: true

- name: Read the Jenkins deploy public key
  community.docker.docker_container_exec:
    container: "{{ jenkins_gui_container_name }}"
    command: cat /var/jenkins_home/.ssh/deploy_key.pub
  register: jenkins_deploy_pub_key
  changed_when: false

- name: Authorize the deploy key for the jenkins account
  ansible.posix.authorized_key:
    user: "{{ jenkins_host_user }}"
    key: "{{ jenkins_deploy_pub_key.stdout }}"
    state: present

# The host answers on the network's gateway address, which Docker assigns and
# which is not knowable ahead of time.
- name: Inspect the jenkins-internal network
  community.docker.docker_network_info:
    name: jenkins-internal
  register: jenkins_network

- name: Resolve the docker gateway address
  ansible.builtin.set_fact:
    jenkins_docker_gateway: "{{ jenkins_network.network.IPAM.Config[0].Gateway }}"

- name: Check whether the gateway is already trusted
  community.docker.docker_container_exec:
    container: "{{ jenkins_gui_container_name }}"
    command: grep -q "{{ jenkins_docker_gateway }}" /var/jenkins_home/.ssh/known_hosts
  register: jenkins_gateway_known_check
  failed_when: false
  changed_when: false

- name: Trust the docker gateway host key
  community.docker.docker_container_exec:
    container: "{{ jenkins_gui_container_name }}"
    user: root
    command: >-
      bash -c "ssh-keyscan -t ed25519 -p {{ vault_ansible_port }} {{ jenkins_docker_gateway }} >> /var/jenkins_home/.ssh/known_hosts &&
      chown jenkins:jenkins /var/jenkins_home/.ssh/known_hosts"
  when: jenkins_gateway_known_check.rc != 0
  changed_when: true
