---
- name: Install the apt prerequisites
  ansible.builtin.apt:
    name: "{{ docker_prerequisites }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the keyring directory
  ansible.builtin.file:
    path: "{{ docker_keyring_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download the Docker signing key
  ansible.builtin.get_url:
    url: "{{ docker_signing_key_url }}"
    dest: "{{ docker_keyring_path }}"
    owner: root
    group: root
    mode: "0644"

# The apt source needs two things the host has to answer for itself: dpkg's
# spelling of the architecture (amd64, where the kernel says x86_64) and the
# distribution codename. Both are read directly instead of through gathered
# facts, so the role behaves the same whatever the calling play does about
# fact gathering.
- name: Read the dpkg architecture
  ansible.builtin.command: dpkg --print-architecture
  register: docker_dpkg_arch
  changed_when: false
  check_mode: false

- name: Read the distribution codename
  ansible.builtin.shell:
    cmd: . /etc/os-release && printf '%s' "$VERSION_CODENAME"
    executable: /bin/bash
  register: docker_codename
  changed_when: false
  check_mode: false

# An empty codename would render `Suites:` blank, which apt accepts and then
# silently resolves to nothing useful.
- name: Validate what the host reported
  ansible.builtin.assert:
    that:
      - docker_dpkg_arch.stdout | length > 0
      - docker_codename.stdout | length > 0
    fail_msg: >-
      Could not determine the architecture ({{ docker_dpkg_arch.stdout | default('') }})
      or the codename ({{ docker_codename.stdout | default('') }}) of this host.
    quiet: true

- name: Render the Docker apt source
  ansible.builtin.template:
    src: docker.sources.j2
    dest: "{{ docker_sources_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Install the Docker engine and the Compose plugin
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    state: "{{ docker_service_state }}"
    enabled: "{{ docker_service_enabled }}"

- name: Add the configured users to the docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
