---
docker_prerequisites:
  - ca-certificates
  - curl

# deb822, so the key is referenced by path rather than dropped into the
# deprecated trusted.gpg.d.
docker_keyring_path: /etc/apt/keyrings/docker.asc
docker_signing_key_url: https://download.docker.com/linux/debian/gpg
docker_repo_url: https://download.docker.com/linux/debian
docker_repo_components: stable
docker_sources_path: /etc/apt/sources.list.d/docker.sources

docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  # What docker_compose_v2 shells out to; every stack role needs it.
  - docker-compose-plugin

# Docker 29.9 keeps its own rules ahead of the MAILCOW jump in INPUT and
# FORWARD, and mailcow's netfilter 1.64 then restarts every 10 s, wiping its
# bans each time. 29.1.2 is the last release it ran cleanly against here.
# Empty the dict to follow the repository again, and drop the holds by hand
# (apt-mark unhold) or with a selection: install task.
docker_package_pins:
  docker-ce: 5:29.1.2-1~debian.13~trixie
  docker-ce-cli: 5:29.1.2-1~debian.13~trixie
  docker-ce-rootless-extras: 5:29.1.2-1~debian.13~trixie
  containerd.io: 2.2.0-2~debian.13~trixie

docker_service_state: started
docker_service_enabled: true

# Membership only takes effect on the next login, which is why Ansible itself
# keeps using become.
docker_users:
  - "{{ ansible_user }}"

# Group allowed to write directly in /opt, next to root.
docker_opt_group: "{{ ansible_user }}"
