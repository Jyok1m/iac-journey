---
# Same paths as the upstream install instructions, so a host where gh was
# first installed by hand is adopted rather than given a second source.
github_cli_keyring_path: /etc/apt/keyrings/githubcli-archive-keyring.gpg
github_cli_signing_key_url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
github_cli_repo_url: https://cli.github.com/packages
github_cli_sources_path: /etc/apt/sources.list.d/github-cli.list

github_cli_packages:
  - gh
