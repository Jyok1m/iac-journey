---
# ------------------------------------------------------------------ #
#                             Host Setup                             #
# ------------------------------------------------------------------ #

- name: Prepare the host
  hosts: portfolio
  vars_files:
    - vaults/registries.yml
  roles:
    - {role: hardening, tags: [hardening]}
    - {role: vrack, tags: [vrack]}
    # Everything downstream shells out to docker compose, and the jenkins role
    # adds its account to the docker group, so the engine comes first.
    - {role: docker, tags: [docker]}
    - {role: docker_registries, tags: [docker, registries]}
  tags: [setup]

# ------------------------------------------------------------------ #
#                                Edge                                #
# ------------------------------------------------------------------ #
# Traefik owns the traefik-public network that every stack below joins,
# so it has to be up before any of them.

- name: Install the edge proxy
  hosts: portfolio
  roles:
    - {role: traefik, tags: [traefik]}
  tags: [edge]

# ------------------------------------------------------------------ #
#                             System Apps                            #
# ------------------------------------------------------------------ #

- name: Install system apps
  hosts: portfolio
  vars_files:
    - vaults/keycloak.yml
    - vaults/komodo.yml
    - vaults/monitoring.yml
  roles:
    - {role: keycloak, tags: [keycloak]}
    - {role: komodo, tags: [komodo]}
    - {role: jenkins, tags: [jenkins]}
    - {role: monitoring, tags: [monitoring]}
  tags: [system-apps]

# ------------------------------------------------------------------ #
#                                Mail                                #
# ------------------------------------------------------------------ #
# A play of its own rather than a role under system-apps: this one also
# drives terraform on the control node, and it has to run after keycloak
# so the OIDC client has a realm to be created in.

- name: Install the mail server
  hosts: portfolio
  vars_files:
    - vaults/mailcow.yml
    - vaults/keycloak.yml
  roles:
    - {role: mailcow, tags: [mailcow]}
  tags: [mail]

# ------------------------------------------------------------------ #
#                            Personal Apps                           #
# ------------------------------------------------------------------ #

- name: Install personal apps
  hosts: portfolio
  vars_files:
    - vaults/heirloom.yml
    - vaults/n8n.yml
  roles:
    - {role: heirloom, tags: [heirloom]}
    - {role: odyssai, tags: [odyssai]}
    - {role: portfolio, tags: [portfolio]}
    - {role: n8n, tags: [n8n]}
  tags: [personal-apps]

# ------------------------------------------------------------------ #
#                             Client Apps                            #
# ------------------------------------------------------------------ #

- name: Install client apps
  hosts: portfolio
  vars_files:
    - vaults/ipseis.yml
    - vaults/backups.yml
  roles:
    - {role: ipseis, tags: [ipseis]}
  tags: [client-apps]
