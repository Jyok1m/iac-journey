---
- name: Prepare the host
  hosts: portfolio
  vars_files:
    - vaults/registries.yml
  roles:
    - {role: hardening, tags: [hardening]}
    - {role: vrack, tags: [vrack]}
    # Everything downstream shells out to docker compose.
    - {role: docker, tags: [docker]}
    - {role: docker_registries, tags: [docker, registries]}
  tags: [setup]

# Traefik owns the traefik-public network every stack below joins.
- name: Install the edge proxy
  hosts: portfolio
  roles:
    - {role: traefik, tags: [traefik]}
  tags: [edge]

- name: Install system apps
  hosts: portfolio
  vars_files:
    - vaults/keycloak.yml
    # Le role keycloak configure le SMTP des realms OdyssAI : il lui faut le
    # mot de passe des boites no-reply.
    - vaults/mailcow.yml
    - vaults/komodo.yml
    - vaults/monitoring.yml
  roles:
    - {role: keycloak, tags: [keycloak]}
    - {role: komodo, tags: [komodo]}
    - {role: jenkins, tags: [jenkins]}
    - {role: monitoring, tags: [monitoring]}
  tags: [system-apps]

# A play of its own: this one also drives terraform on the control node, and it
# has to run after keycloak so the OIDC client has a realm to be created in.
- name: Install the mail server
  hosts: portfolio
  vars_files:
    - vaults/mailcow.yml
    - vaults/keycloak.yml
  roles:
    - {role: mailcow, tags: [mailcow]}
  tags: [mail]

- name: Install personal apps
  hosts: portfolio
  vars_files:
    - vaults/heirloom.yml
    - vaults/n8n.yml
    - vaults/odyssai.yml
  roles:
    - {role: heirloom, tags: [heirloom]}
    - {role: odyssai, tags: [odyssai]}
    - {role: portfolio, tags: [portfolio]}
    - {role: n8n, tags: [n8n]}
  tags: [personal-apps]

- name: Install client apps
  hosts: portfolio
  vars_files:
    - vaults/ipseis.yml
    - vaults/backups.yml
  roles:
    - {role: ipseis, tags: [ipseis]}
  tags: [client-apps]
