---
# ------------------------------------------------------------------ #
#                             System Apps                            #
# ------------------------------------------------------------------ #

- name: Install system apps
  hosts: portfolio
  vars_files:
    - vaults/keycloak.yml
    - vaults/komodo.yml
  roles:
    - { role: keycloak, tags: [keycloak] }
    - { role: komodo, tags: [komodo] }
  tags: [system-apps]

# ------------------------------------------------------------------ #
#                            Personal Apps                           #
# ------------------------------------------------------------------ #

- name: Install personal apps
  hosts: portfolio
  vars_files:
    - vaults/heirloom.yml
  roles:
    - { role: heirloom, tags: [heirloom] }
    - { role: portfolio, tags: [portfolio] }
  tags: [personal-apps]

# ------------------------------------------------------------------ #
#                             Client Apps                            #
# ------------------------------------------------------------------ #

- name: Install client apps
  hosts: portfolio
  vars_files:
    - vaults/ipseis.yml
    - vaults/backups.yml
  roles:
    - { role: ipseis, tags: [ipseis] }
  tags: [client-apps]
