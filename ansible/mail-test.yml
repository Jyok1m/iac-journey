---
# Sends one real message so deliverability is scored by an outside judge.
#
#   ansible-playbook ansible/mail-test.yml -e mail_test_to=test-xxxx@srv1.mail-tester.com
#
# Through 587 with SASL as a mail client would, not by dropping a file in the
# queue: the message is signed, aligned and queued exactly like a real one.

- name: Send a deliverability test message
  hosts: portfolio
  gather_facts: false
  vars_files:
    - vaults/mailcow.yml
  vars:
    # Keyed by full address: no-reply exists on more than one domain.
    mail_test_from: "info@{{ portfolio_domain_com }}"
  tasks:
    - name: Require a destination
      ansible.builtin.assert:
        that:
          - mail_test_to is defined
          - mail_test_to | length > 0
        fail_msg: >-
          Pass the destination, e.g.
          -e mail_test_to=test-xxxx@srv1.mail-tester.com
        quiet: true

    # always: a failed send would otherwise end the play with the mailbox
    # password still sitting on disk.
    - name: Send a test message
      block:
        # Not an argument: that would show in the host's process listing.
        - name: Stage the sender
          ansible.builtin.copy:
            content: |
              {{ mail_test_from }}
              {{ mailcow_vault_mailboxes[mail_test_from] }}
              {{ mail_test_to }}
            dest: /root/.mailtest.creds
            owner: root
            group: root
            mode: "0600"
          no_log: true

        - name: Send the message over submission with SASL
          ansible.builtin.script:
            cmd: files/send-test-mail.py /root/.mailtest.creds
            executable: /usr/bin/python3
          register: mail_test_result
          changed_when: "'sent' in mail_test_result.stdout"
      always:
        - name: Remove the staged credential
          ansible.builtin.file:
            path: /root/.mailtest.creds
            state: absent

    - name: Report what the server did with it
      ansible.builtin.debug:
        msg: "{{ mail_test_result.stdout_lines }}"
